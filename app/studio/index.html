<!doctype html>
<html lang="en" data-theme="flightglass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060C" id="themeColor">
  <title>Flight Glass — Impact Studio</title>
  <!--
    PORTRETT-STUDIO (eierbeslutning 2026-08-28, ført via orkestrator):
    Sol-handoffen er komposisjonsfasit; landskapsflaten er bevart som
    landscape.html (V2). Denne fila = handoffens DOM/interaksjon med
    (1) motoren via adapter i updateScene()-sømmen (mock-formlene er UTE),
    (2) de låste vedtakene integrert: LIE-velger ved køllevelgeren (D93-kjerne:
    diskret, navngitt, aldri fri mm), strike-svar + entry/low/exit i FACE ON
    (STRIKE-viewet droppet), D67-ord, 0.1-steg, HOME-ord (N-b), D89-båndfarger,
    D65-loft med ASSUMED-chip, Higgsfield turf/kølle-materiale.
    A/B-tema består (?theme=titan|flightglass) til eier velger palett.
    Ingen trig i denne fila — adapteren projiserer (fysikklinten står).
  -->
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      document.documentElement.dataset.theme = requested === 'titan' ? 'titan' : 'flightglass';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../onboarding/onboarding.css" />
  <style>
    /* Handoffens tokenlag. flightglass-verdiene ER v3-tokens (tokens.css);
       titan er A/B-wildcarden. Samme DOM, tema kun på html[data-theme]. */
    :root {
      color-scheme: dark;
      --black: #050606;
      --body: #020303;
      --panel: #0d0e0f;
      --panel-2: #131416;
      --recess: #08090a;
      --steel: #3a3b3d;
      --steel-soft: #222426;
      --ink: #f5f1e9;
      --muted: #8f8d87;
      --copper: #ff7a32;
      --copper-hot: #ff9d64;
      --accent-rgb: 255, 122, 50;
      --cyan: #67d6ff;
      --magenta: #f765b3;
      --good: #82f0b7;
      --bad: #ff7b8a;
      --strike-gold: #f0bd8d;
      --shell-top: #090a0b;
      --shell-border: #303234;
      --surface-top: #202123;
      --surface-bottom: #0b0c0d;
      --surface-line: #3b352f;
      --canvas-field: #0c0916;
      --canvas-sky-1: #151020;
      --canvas-sky-2: #171527;
      --canvas-sky-3: #11150f;
      --canvas-shape: #3b315a;
      --canvas-grid: #77758d;
      --canvas-plane: #67d6ff;
      --canvas-turf-top: #6da541;
      --canvas-turf-mid: #365d27;
      --canvas-turf-line: #8bc75a;
      --canvas-arc: #e9e7e1;
      --ease: cubic-bezier(.2,.75,.25,1);
      font-family: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="flightglass"] {
      --black: #07060c;
      --body: #040309;
      --panel: #110d1c;
      --panel-2: #171224;
      --recess: #0d0a18;
      --steel: #3b3152;
      --steel-soft: #211a31;
      --ink: #f5f2ff;
      --muted: #a79fc7;
      --copper: #ff8a4d;
      --copper-hot: #ffb08a;
      --accent-rgb: 255, 138, 77;
      --cyan: #5bc8f5;
      --magenta: #f470b8;
      --good: #58e6a8;
      --bad: #ff7b8a;
      --strike-gold: #e3b05c;
      --shell-top: #0d0916;
      --shell-border: #362d4a;
      --surface-top: #1d1729;
      --surface-bottom: #0d0a18;
      --surface-line: #493757;
      --canvas-field: #0d0a18;
      --canvas-sky-1: #130f21;
      --canvas-sky-2: #171329;
      --canvas-sky-3: #0e1018;
      --canvas-shape: #3b315a;
      --canvas-grid: #847aa8;
      --canvas-plane: #9c8df5;
      --canvas-turf-top: #58e6a8;
      --canvas-turf-mid: #267b5f;
      --canvas-turf-line: #70efb7;
      --canvas-arc: #f5f2ff;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }

    html, body { margin: 0; min-height: 100%; background: var(--body); }

    body {
      min-height: 100dvh;
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, select, input { font: inherit; }
    button, select { min-height: 44px; color: inherit; -webkit-tap-highlight-color: transparent; }

    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--copper-hot);
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 430px);
      min-height: 100dvh;
      background:
        radial-gradient(80% 35% at 50% -4%, rgba(var(--accent-rgb),.09), transparent 68%),
        linear-gradient(180deg, var(--shell-top) 0%, var(--black) 100%);
      display: grid;
      grid-template-rows: auto auto auto minmax(292px, 1fr) auto;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .topbar {
      min-height: 50px;
      padding: max(10px, env(safe-area-inset-top)) 14px 7px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .title-lockup { display: flex; align-items: center; gap: 10px; min-width: 0; }

    /* AVVIK (N-b, låst): ordet HOME, aldri ikon — handoffens maskinerte sirkel beholdt */
    .home-exit {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--surface-top), var(--recess));
      border: 1px solid var(--shell-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 5px 12px rgba(0,0,0,.45);
      color: var(--muted);
      text-decoration: none;
      font-size: 9px; font-weight: 700; letter-spacing: .09em;
      -webkit-tap-highlight-color: transparent;
    }
    .home-exit:active { transform: scale(.97); }

    .eyebrow, .topbar h1 { margin: 0; }
    .eyebrow { color: var(--muted); font-size: 10px; line-height: 1.2; letter-spacing: .1em; text-transform: uppercase; }
    .topbar h1 { font-size: 16px; line-height: 1.2; letter-spacing: -.01em; font-family: "Space Grotesk", "Geist", sans-serif; }

    .reset {
      min-width: 44px; padding: 0;
      border: 0; background: transparent; color: var(--muted);
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; cursor: pointer;
    }

    .metrics { padding: 7px 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .metric {
      min-height: 52px;
      padding: 8px 12px 7px;
      border: 1px solid var(--steel-soft);
      border-bottom-color: #090a0a;
      border-radius: 9px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 32%),
        linear-gradient(145deg, var(--panel-2), var(--recess));
      box-shadow: inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.03);
      display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 7px;
    }

    .metric-dot { width: 5px; height: 5px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
    .metric.attack .metric-dot { color: var(--magenta); background: currentColor; }
    .metric.path .metric-dot { color: var(--cyan); background: currentColor; }
    .metric-copy { min-width: 0; }
    .metric-label { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .metric-value { display: block; min-width: 6ch; margin-top: 2px; font: 600 22px/1 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }

    /* AVVIK (U1/D3b, eierbeslutning 2028-08-28-pakken): strike-svaret som lav
       tekststripe, alltid synlig i FO og DTL. Båndordet bærer (D10), fargen
       forsterker (D89: good/strike-gull/bad). Loft-antagelsen (D65) som
       meta + ASSUMED-chip til høyre. */
    .strike-strip {
      margin: 7px 12px 8px;
      min-height: 30px;
      padding: 5px 12px;
      border: 1px solid var(--steel-soft);
      border-radius: 8px;
      background: var(--recess);
      display: flex; align-items: center; gap: 8px;
      font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden;
    }
    .strike-strip .lab { color: var(--muted); font-family: "Geist", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: .09em; }
    .strike-strip .band { font-size: 12px; font-weight: 600; }
    .strike-strip .off { color: var(--ink); font-size: 11px; }
    .strike-strip .meta { margin-left: auto; color: var(--muted); font-size: 9px; overflow: hidden; text-overflow: ellipsis; }
    .prov-chip {
      display: inline-block; border: 1px solid var(--steel-soft); border-radius: 4px;
      padding: 0 3px; margin-left: 4px;
      font-family: "Geist", sans-serif; font-size: 8px; font-weight: 700; letter-spacing: .08em;
      color: var(--muted); vertical-align: 1px;
    }

    .scene-wrap { padding: 0 10px; min-height: 0; }

    .scene {
      height: 100%; min-height: 292px;
      position: relative; overflow: hidden;
      border-radius: 17px;
      background: var(--canvas-field);
      border: 1px solid var(--steel);
      box-shadow: inset 0 0 0 1px #090a0a, inset 0 1px 0 rgba(255,255,255,.12), 0 11px 26px rgba(0,0,0,.55);
    }
    .scene::before {
      content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 26px 8px rgba(0,0,0,.65), inset 0 -1px 0 rgba(var(--accent-rgb),.16);
    }
    .scene svg { width: 100%; height: 100%; display: block; }

    .scene-tools {
      position: absolute; left: 12px; right: 12px; top: 11px; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;
    }
    .tool-selects { display: flex; gap: 6px; min-width: 0; }

    .club-select-wrap { position: relative; min-width: 0; }
    .club-select-wrap::after {
      content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; pointer-events: none;
      border-right: 1.5px solid var(--copper-hot); border-bottom: 1.5px solid var(--copper-hot);
      transform: translateY(-65%) rotate(45deg);
    }
    .club-select {
      appearance: none; max-width: 100%; padding: 0 27px 0 10px;
      border: 1px solid var(--surface-line); border-radius: 8px;
      background: color-mix(in srgb, var(--recess) 90%, transparent); backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.32);
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
    }

    .view-switch {
      display: grid; grid-template-columns: repeat(2, 1fr); padding: 3px;
      border-radius: 9px; background: color-mix(in srgb, var(--recess) 88%, transparent); border: 1px solid var(--steel-soft);
    }
    .view-switch button {
      min-width: 46px; min-height: 44px; padding: 0 7px;
      border: 0; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .05em; cursor: pointer;
    }
    .view-switch button[aria-pressed="true"] {
      color: var(--ink); background: linear-gradient(180deg, var(--steel), var(--panel-2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 8px rgba(0,0,0,.5);
    }

    .arc-main { transition: filter 350ms var(--ease), stroke-width 350ms var(--ease), stroke 350ms var(--ease); }
    .guide-line, .measure-tag { opacity: 0; transition: opacity 350ms var(--ease); }
    .scene.is-adjusting .arc-main { stroke: var(--copper-hot); stroke-width: 4.25; filter: drop-shadow(0 0 8px rgba(var(--accent-rgb),.82)); transition-duration: 90ms; }
    .scene.is-adjusting .guide-line, .scene.is-adjusting .measure-tag { opacity: 1; transition-duration: 90ms; }
    .canvas-view[hidden] { display: none; }
    .canvas-view { transform-origin: 50% 55%; }
    .scene.is-changing-view .canvas-view:not([hidden]) { animation: view-seat 240ms var(--ease); }
    .geometry-focus { transition: opacity 350ms var(--ease), filter 350ms var(--ease), stroke-width 350ms var(--ease); }
    .scene.is-adjusting .geometry-focus { opacity: 1 !important; filter: drop-shadow(0 0 7px rgba(var(--accent-rgb),.7)); transition-duration: 90ms; }
    .scene.is-adjusting .dtl-plane { fill-opacity: .34; stroke-opacity: .9; }
    @keyframes view-seat { 0% { opacity: .5; transform: scale(.985); } 100% { opacity: 1; transform: none; } }

    .control-deck {
      margin-top: 8px;
      border-top: 1px solid var(--steel-soft);
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 4px),
        linear-gradient(160deg, var(--panel-2), var(--recess) 72%);
      box-shadow: 0 -10px 25px rgba(0,0,0,.28);
      padding: 9px 11px calc(10px + env(safe-area-inset-bottom));
    }

    .active-instrument {
      min-height: 105px; position: relative;
      border: 1px solid var(--surface-line);
      border-radius: 12px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
        linear-gradient(145deg, var(--surface-top), var(--panel-2) 54%, var(--surface-bottom));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 #000, 0 6px 14px rgba(0,0,0,.4);
      padding: 11px 14px 14px;
      overflow: hidden;
    }
    .active-instrument::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
      background: var(--copper-hot);
    }

    .instrument-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .instrument-head p { margin: 0; }
    .active-label { color: var(--muted); font-family: "Geist", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .active-value { min-width: 9ch; margin-top: 3px !important; font: 600 24px/1 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -.05em; white-space: nowrap; }
    .active-value .unit { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
    .slider-row { margin-top: 12px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; }
    /* AVVIK (D67): endene bærer ord, aldri nakne fortegn */
    .tick-label { color: var(--muted); font: 600 9px/1.2 "IBM Plex Mono", monospace; min-width: 25px; max-width: 78px; }
    .tick-label:last-child { text-align: right; }

    input[type="range"] { width: 100%; height: 44px; margin: 0; appearance: none; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px; border-radius: 99px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--copper) 32%, var(--steel-soft)), var(--copper) var(--fill,50%), var(--steel-soft) var(--fill,50%));
      box-shadow: inset 0 1px 2px #000, 0 1px 0 rgba(255,255,255,.07);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 26px; height: 26px; border-radius: 50%; margin-top: -10px;
      border: 1px solid var(--copper-hot);
      background:
        radial-gradient(circle at 38% 32%, #ffd0b4 0 8%, transparent 9%),
        linear-gradient(145deg, var(--copper-hot), var(--copper) 68%);
      box-shadow: 0 0 0 3px var(--panel-2), 0 4px 11px #000, inset 0 1px 0 rgba(255,255,255,.48);
    }
    input[type="range"]::-moz-range-track { height: 5px; border-radius: 99px; background: var(--steel-soft); box-shadow: inset 0 1px 2px #000; }
    input[type="range"]::-moz-range-progress { height: 5px; border-radius: 99px; background: var(--copper); }
    input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--copper-hot); background: var(--copper); box-shadow: 0 0 0 3px var(--panel-2), 0 4px 11px #000; }

    .parameter-rail {
      margin-top: 8px; min-height: 58px;
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--steel-soft); border-bottom: 1px solid #080909;
      background: var(--recess);
    }
    .parameter-rail button {
      min-width: 0; min-height: 58px; padding: 7px 4px 6px;
      border: 0; border-right: 1px solid var(--steel-soft);
      background: transparent; color: var(--muted); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-family: "Geist", sans-serif;
      white-space: nowrap; overflow: hidden;
    }
    .parameter-rail button:last-child { border-right: 0; }
    .parameter-rail button:active { color: var(--copper-hot); background: rgba(var(--accent-rgb),.045); }
    .parameter-rail-label {
      max-width: 100%; color: var(--muted);
      font-size: 10px; line-height: 1; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; white-space: nowrap;
    }
    .parameter-rail-value {
      display: block; min-width: 8ch; color: var(--ink);
      font: 500 12px/1 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
      letter-spacing: -.02em; text-align: center; white-space: nowrap;
    }

    .control-deck.is-swapping .active-instrument { animation: instrument-swap 220ms var(--ease); }
    @keyframes instrument-swap { 0% { opacity: .6; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }

    @media (min-width: 431px) {
      body { padding: 20px; }
      .app { min-height: min(900px, calc(100dvh - 40px)); border: 1px solid var(--shell-border); border-radius: 28px; box-shadow: 0 35px 90px #000; }
    }

    @media (max-height: 830px) {
      .app { grid-template-rows: auto auto auto minmax(276px, 1fr) auto; }
      .topbar { min-height: 45px; padding-bottom: 4px; }
      .metrics { padding-top: 4px; }
      .metric { min-height: 48px; padding-top: 6px; padding-bottom: 5px; }
      .strike-strip { margin-top: 5px; margin-bottom: 6px; min-height: 26px; padding-block: 3px; }
      .scene { min-height: 276px; }
      .active-instrument { min-height: 96px; padding-top: 9px; padding-bottom: 9px; }
      .slider-row { margin-top: 8px; }
      .control-deck { padding-top: 7px; padding-bottom: calc(7px + env(safe-area-inset-bottom)); }
      .parameter-rail { margin-top: 5px; min-height: 54px; }
      .parameter-rail button { min-height: 54px; padding-block: 5px; }
    }

    /* D139/D142: rotasjonsporten er et SCENE-overlegg, aldri skjermoverlegg —
       modulkrom og kontroller står synlige og AKTIVE mens den vises. Ingen
       HOME-sirkel i porten (D126). D142: porten er WEB-FALLBACK, ikke
       produktatferd — native V1 orienteringslåses (D70); SwiftUI-laget skal
       IKKE bygge den. Ordlyd eierlåst til kortformen. */
    .rotate {
      position: absolute; inset: 0; z-index: 6; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: color-mix(in srgb, var(--canvas-field) 88%, transparent);
      backdrop-filter: blur(4px);
      border-radius: inherit; text-align: center; padding: 24px;
    }
    .rotate .ico { width: 40px; height: 40px; animation: tilt 1.8s ease-in-out infinite; color: var(--muted); }
    .rotate .ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .rotate p { margin: 0; font-size: 14px; max-width: 240px; color: var(--ink); }
    @keyframes tilt { 0%,100% { transform: rotate(78deg); } 50% { transform: rotate(-12deg); } }
    @media (orientation: landscape) { .rotate { display: flex; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body data-screen="studio" data-home="../nav/index.html">
  <main class="app" aria-label="Impact Studio">
    <header class="topbar">
      <div class="title-lockup">
        <a class="home-exit" data-home-exit href="../nav/index.html" aria-label="Home">HOME</a>
        <div>
          <p class="eyebrow">Flight Glass</p>
          <h1>Impact Studio</h1>
        </div>
      </div>
      <button class="reset" type="button" id="resetButton" aria-label="Reset all parameters">Reset</button>
    </header>

    <section class="metrics" aria-label="Calculated impact metrics">
      <article class="metric attack">
        <span class="metric-dot" aria-hidden="true"></span>
        <div class="metric-copy"><span class="metric-label">Attack angle</span><output class="metric-value" id="attackValue">&#8722;4.3&deg;</output></div>
      </article>
      <article class="metric path">
        <span class="metric-dot" aria-hidden="true"></span>
        <div class="metric-copy"><span class="metric-label">Club path</span><output class="metric-value" id="pathValue">+2.5&deg;</output></div>
      </article>
    </section>

    <div class="strike-strip" id="strikeStrip" aria-label="Strike result">
      <span class="lab">STRIKE</span>
      <span class="band" id="strikeBandText">PURE</span>
      <span class="off" id="strikeOffsetText">0.0 mm</span>
      <span class="meta" id="strikeMeta">DYNAMIC LOFT 31.0&deg;<span class="prov-chip">ASSUMED</span></span>
    </div>

    <section class="scene-wrap" aria-label="Interactive swing arc visualization">
      <div class="scene" id="stage">
        <div class="scene-tools">
          <div class="tool-selects">
            <label class="club-select-wrap">
              <span class="sr-only">Club</span>

<script type="module">
/* ============================================================
 * MOTOR: engine/studioSolve via adapter (D13/D61/D62 — mock-formlene i
 * Sol-handoffen er FJERNET; updateScene() driver SVG-en med adapterpunkter).
 * Ingen trig her; all projeksjon i adapter/. Formater fra adapter (D28/D67).
 * ============================================================ */
import { studioSolve, CLUB_GEOMETRY, LIE_PRESETS } from '../../engine/src/studioSolve.js';
import {
  arcWorldPoint, arcWorldPoints, tangentWorld, planePoint,
  faceOnArcPoints, pinholeCamera, projectPoint,
} from '../../adapter/src/studioShape.js';
import { formatAngle } from '../../adapter/src/format.js';
import {
  formatLongitudinalCm, formatLongitudinalMetres, formatHeightCm,
  formatFaceOffsetMm, formatLieMm,
} from '../../adapter/src/displayStudio.js';
import haptics from './sa-haptics.js';

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* D65 (eierlåst): tre køller, fast dynamisk loft merket som antagelse. */
const CLUB_LABEL = { driver: 'DRIVER', threeWood: '3-WOOD', midIron: 'MID-IRON' };
const DYNAMIC_LOFT = { driver: 12.5, threeWood: 15.0, midIron: 31.0 };
const PLANE_PRESET = { driver: 50, threeWood: 55, midIron: 60 };
const HEAD_MM = { driver: 96, threeWood: 68, midIron: 102 };
const HEAD_IMG = { driver: './assets/driver-head.png', threeWood: './assets/driver-head.png', midIron: './assets/iron-head.png' };

const LIE_LABEL = { hardpan: 'HARDPAN', tight: 'TIGHT', fairway: 'FAIRWAY',
  lightRough: 'LIGHT ROUGH', rough: 'ROUGH', tee: 'TEE', teeHigh: 'HIGH TEE' };

/* D89 (eierlåst): tre-trinns kvalitetsskala. Ordet bærer, fargen forsterker. */
const BAND_TEXT = { Duff: 'DUFF', Fat: 'FAT', Pure: 'PURE', Thin: 'THIN', Whiff: 'WHIFF',
  OffFace: 'OFF FACE', Low: 'LOW', Centre: 'CENTRE', High: 'HIGH' };
const BAND_HUE = { Pure: 'var(--good)', Centre: 'var(--good)',
  Thin: 'var(--strike-gold)', Fat: 'var(--strike-gold)', High: 'var(--strike-gold)', Low: 'var(--strike-gold)',
  Duff: 'var(--bad)', Whiff: 'var(--bad)', OffFace: 'var(--bad)' };

/* Handoffens tilstandskontrakt — steg rettet til spec 03 (0.1). */
const parameterState = {
  ballPosition: { label: 'Ball position', value: 0, min: -20, max: 20, step: .1, unit: 'cm',
    aria: 'Ball position in centimetres', fmt: formatLongitudinalCm },
  swingPlane: { label: 'Swing plane', value: 60, min: 30, max: 80, step: .5, unit: '°',
    aria: 'Swing plane in degrees', fmt: v => formatAngle(v) },
  swingDirection: { label: 'Swing direction', value: 0, min: -12, max: 12, step: .1, unit: '°',
    aria: 'Swing direction in degrees', fmt: v => formatAngle(v, { signed: true }) },
  arcHeight: { label: 'Arc height', value: 0, min: -5, max: 5, step: .1, unit: 'cm',
    aria: 'Arc height in centimetres', fmt: formatHeightCm },
};
const defaults = JSON.parse(JSON.stringify(
  Object.fromEntries(Object.entries(parameterState).map(([k, v]) => [k, { value: v.value }]))));
let activeKey = 'ballPosition';
let currentView = 'fo';
let clubKey = 'midIron';
let lieKey = 'fairway';   /* D138: standard-lie er FAIRWAY */
let idleTimer;
let viewTimer;

const $ = id => document.getElementById(id);
const scene = $('stage');
const deck = $('controlDeck');
const rail = $('parameterRail');
const slider = $('parameterSlider');
const activeLabel = $('activeLabel');
const activeValue = $('activeValue');
const activeUnit = $('activeUnit');
const minLabel = $('minLabel');
const maxLabel = $('maxLabel');
const sceneTitle = $('sceneTitle');
const sceneDesc = $('sceneDesc');
const clubSelect = $('clubSelect');
const lieSelect = $('lieSelect');
const attackValue = $('attackValue');
const pathValue = $('pathValue');
const statusAnnouncer = $('statusAnnouncer');
const themeColor = $('themeColor');

function setTheme(theme) {
  const nextTheme = theme === 'titan' ? 'titan' : 'flightglass';
  document.documentElement.dataset.theme = nextTheme;
  themeColor.content = nextTheme === 'flightglass' ? '#07060C' : '#050606';
  return nextTheme;
}
setTheme(document.documentElement.dataset.theme);

/* ── Motorkobling ─────────────────────────────────────────────────────── */
let solved = null;
function computeSolved() {
  solved = studioSolve({
    swingPlane: parameterState.swingPlane.value,
    swingDirection: parameterState.swingDirection.value,
    ballPositionCm: parameterState.ballPosition.value,
    arcHeightCm: parameterState.arcHeight.value,
    lieHeightMm: LIE_PRESETS[lieKey],
    club: CLUB_GEOMETRY[clubKey],
    dynamicLoftDeg: DYNAMIC_LOFT[clubKey],
  });
}
computeSolved();

/* Verdivisning: adapterstrenger. For cm-akser splittes tall og ord/enhet
   til handoffens value+unit-oppsett; vinkler er én token. */
function splitCm(text) {
  const i = text.indexOf(' ');
  return [text.slice(0, i), text.slice(i + 1)];
}
function activeParts(key) {
  const p = parameterState[key];
  const text = p.fmt(p.value);
  if (p.unit === 'cm') return splitCm(text);
  return [text, ''];
}
const railValue = (key, config) => config.fmt(config.value);

function setAdjusting() {
  clearTimeout(idleTimer);
  scene.classList.add('is-adjusting');
  idleTimer = setTimeout(() => scene.classList.remove('is-adjusting'), 350);
}

function pulseView() {
  clearTimeout(viewTimer);
  scene.classList.remove('is-changing-view');
  void scene.offsetWidth;
  scene.classList.add('is-changing-view');
  viewTimer = setTimeout(() => scene.classList.remove('is-changing-view'), 260);
}

function renderRail() {
  rail.replaceChildren();
  Object.entries(parameterState).filter(([key]) => key !== activeKey).forEach(([key, config]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.parameter = key;
    button.setAttribute('aria-label', `${config.label}, ${railValue(key, config)}`);
    const label = document.createElement('span');
    label.className = 'parameter-rail-label';
    label.textContent = config.label;
    const value = document.createElement('span');
    value.className = 'parameter-rail-value';
    value.textContent = railValue(key, config);
    button.append(label, value);
    button.addEventListener('click', () => switchParameter(key));
    rail.appendChild(button);
  });
}

function switchParameter(key) {
  activeKey = key;
  deck.classList.remove('is-swapping');
  void deck.offsetWidth;
  deck.classList.add('is-swapping');
  setTimeout(() => deck.classList.remove('is-swapping'), 230);
  syncInstrument();
  renderRail();
  setAdjusting();
  statusAnnouncer.textContent = `${parameterState[key].label} selected. ${railValue(key, parameterState[key])}.`;
  requestAnimationFrame(() => slider.focus({ preventScroll: true }));
}

function syncInstrument() {
  const active = parameterState[activeKey];
  activeLabel.textContent = active.label;
  const [valPart, unitPart] = activeParts(activeKey);
  activeValue.textContent = valPart;
  activeUnit.textContent = unitPart;
  slider.min = active.min;
  slider.max = active.max;
  slider.step = active.step;
  slider.value = active.value;
  slider.setAttribute('aria-label', active.aria);
  slider.setAttribute('aria-valuetext', railValue(activeKey, active));
  /* AVVIK (D67): endene bærer ord (20.0 cm before), aldri nakne fortegn */
  minLabel.textContent = active.fmt(active.min);
  maxLabel.textContent = active.fmt(active.max);
  const fill = ((active.value - active.min) / (active.max - active.min)) * 100;
  slider.style.setProperty('--fill', `${fill}%`);
  updateScene();
}

/* ── Scene: FO — stancefast kamera (handoffens BACK/MID/FWD-verden).
   Adapterpunkter er ball-relative meter; stanceskiftet er ballPos. ─────── */
const FO = { S: 310, STANCE_X: 205, GROUND_Y: 250, BALL_R_PX: 12, SWEEP: 0.85 };
/* Hybrid vertikal gain (eierens mock-beslutning fra landskapsflaten, arvet):
   kontaktbåndet ~1:1, armene rampes glatt. tanh/cosh er ikke fysikk-lint-tema. */
const PED_K = 1.7, PED_Z0 = 0.055;
const pedF = z => PED_K * z - (PED_K - 1) * PED_Z0 * Math.tanh(z / PED_Z0);

function foMap() {
  const ballPosM = parameterState.ballPosition.value / 100;
  const ballX = FO.STANCE_X + ballPosM * FO.S;
  return {
    ballX,
    X: xm => ballX + xm * FO.S,                 // xm: ball-relativ meter
    Y: zm => FO.GROUND_Y - pedF(zm) * FO.S,
  };
}

function updateFaceOn() {
  const M = foMap();
  const lift = LIE_PRESETS[lieKey] / 1000;
  const rM = solved.ballRadiusM;
  const mmToBallPx = FO.BALL_R_PX / (rM * 1000);   // ball-rom (presentasjonsskala som mocken)

  /* buen — motorens punkter, projisert i adapteren */
  const pts = faceOnArcPoints(solved, 96, FO.SWEEP);
  const d = pts.map(([x, z], i) => `${i ? 'L' : 'M'}${M.X(x).toFixed(1)} ${M.Y(z).toFixed(1)}`).join('');
  $('foArcPath').setAttribute('d', d);
  $('foArcGhost').setAttribute('d', d);

  /* ball (oversized som i handoffen — presentasjon; tallene er motorens) */
  const ballY = M.Y(lift) - FO.BALL_R_PX;
  $('foBallGroup').setAttribute('transform', `translate(${M.ballX.toFixed(1)} ${ballY.toFixed(1)})`);

  /* lie-visualer (G-4/D66): tee-sprite for tee-lies, strå for gress-lies */
  const teeImg = $('foTeeImg');
  const blades = $('foLieBlades');
  const isTee = lieKey === 'tee' || lieKey === 'teeHigh';
  const ballBottom = ballY + FO.BALL_R_PX * 0.9;
  if (isTee) {
    const teeH = Math.max(4, FO.GROUND_Y - ballBottom + 2);
    const teeW = teeH * 0.55;
    teeImg.style.display = '';
    teeImg.setAttribute('x', (M.ballX - teeW / 2).toFixed(1));
    teeImg.setAttribute('y', ballBottom.toFixed(1));
    teeImg.setAttribute('width', teeW.toFixed(1));
    teeImg.setAttribute('height', teeH.toFixed(1));
    blades.innerHTML = '';
  } else if (LIE_PRESETS[lieKey] > 0) {
    teeImg.style.display = 'none';
    const bx = M.ballX;
    blades.innerHTML = [-6, -2, 3, 7].map(o =>
      `<path d="M${(bx + o).toFixed(1)} ${FO.GROUND_Y} L${(bx + o * 0.6).toFixed(1)} ${(ballBottom + 1).toFixed(1)}"/>`).join('');
  } else {
    teeImg.style.display = 'none';
    blades.innerHTML = '';
  }

  /* kølle: sprite kalibrert mot ballradius, ved hendelsen som forklarer
     utfallet (entry ved turf-først, ellers treff) — mockens ghostregel */
  const t0g = solved.groundCrossingTheta0;
  let anchor = { x: 0, z: solved.clubHeightM };
  if (t0g !== null) {
    const entry = arcWorldPoint(solved, -t0g);
    if (entry.x < -0.001) anchor = entry;
  }
  const headHpx = HEAD_MM[clubKey] * mmToBallPx;
  const img = $('foClubImg');
  img.setAttribute('href', HEAD_IMG[clubKey]);
  img.setAttribute('width', (headHpx * 0.9).toFixed(1));
  img.setAttribute('height', headHpx.toFixed(1));
  img.setAttribute('x', (-headHpx * 0.9).toFixed(1));
  img.setAttribute('y', (-headHpx).toFixed(1));
  const clubX = M.X(anchor.x) - FO.BALL_R_PX * 0.92;
  const clubY = M.Y(anchor.z);
  $('foClubGroup').setAttribute('transform', `translate(${clubX.toFixed(1)} ${clubY.toFixed(1)})`);
  /* D24: sweetspot-merke (over sålen, i ball-rom-skala) + kontaktpunkt der
     ballsenteret møter flaten. Avstanden mellom dem ER faceCentreOffsetMm. */
  const sweetY = -(solved.sweetSpotHeightMm * mmToBallPx);
  $('foSweetNotch').setAttribute('x1', '-7');
  $('foSweetNotch').setAttribute('x2', '1');
  $('foSweetNotch').setAttribute('y1', sweetY.toFixed(1));
  $('foSweetNotch').setAttribute('y2', sweetY.toFixed(1));
  $('foContactDot').setAttribute('cx', '-3');
  $('foContactDot').setAttribute('cy', (ballY - clubY).toFixed(1));

  /* low point — markør + ord + verdi (D67-ord fra adapteren).
     Merk (Sol-fasit/D134): markøren står FAST på skjermen mens BALLEN flytter
     seg — stancefast kamera; svingens lavpunkt er stancens, ballen plasseres. */
  const lpX = M.X(solved.effectiveLowPointX);
  const lpY = M.Y(solved.lowPointZ);
  $('foLowPoint').setAttribute('cx', lpX.toFixed(1));
  $('foLowPoint').setAttribute('cy', lpY.toFixed(1));
  $('foLowText').setAttribute('x', lpX.toFixed(1));
  $('foLowVal').setAttribute('x', lpX.toFixed(1));
  $('foLowVal').textContent = formatLongitudinalMetres(solved.effectiveLowPointX);
  /* KONTRAKT (D114, rettet etter E-funn): dataset.lowPointMarker er
     «view,x,y,1» i CSS-PIKSLER relativt #stage — aldri SVG-brukerenheter.
     Mappingen er preserveAspectRatio="xMidYMax meet": uniform skala,
     midtstilt x, bunnjustert y. Ved 0-målt boks (skjult fane) beholdes
     forrige gyldige verdi framfor å skrive en villedende.
     Kroken kjenner bare LOW POINT — som i v4 står FAST (D134, målt: identisk
     verdi for ballpos −8/0/+12 mens ballen vandrer). En konsument som vil
     verne «det som beveger seg» må ta ball OG low point som ETT anker, ikke
     lese kroken alene. */
  const svgRect = $('swingSvg').getBoundingClientRect();
  const stageRect = scene.getBoundingClientRect();
  if (svgRect.width > 0 && svgRect.height > 0) {
    const sc = Math.min(svgRect.width / 390, svgRect.height / 330);
    const cssX = (svgRect.left - stageRect.left) + (svgRect.width - 390 * sc) / 2 + lpX * sc;
    const cssY = (svgRect.top - stageRect.top) + (svgRect.height - 330 * sc) + lpY * sc;
    scene.dataset.lowPointMarker = ['fo', cssX.toFixed(1), cssY.toFixed(1), '1'].join(',');
  }

  /* entry/exit — alltid i FO når de finnes; ellers NO TURF CONTACT i
     turf-regimet (muted — informasjon, ikke feiltilstand) */
  const hasCross = t0g !== null;
  const gy = FO.GROUND_Y;
  if (hasCross) {
    const e = arcWorldPoint(solved, -t0g), x = arcWorldPoint(solved, t0g);
    const ex = M.X(e.x), xx = M.X(x.x);
    $('foEntryLine').setAttribute('d', `M${ex.toFixed(1)} ${gy + 2}V${gy + 14}`);
    $('foEntryText').setAttribute('x', ex.toFixed(1));
    $('foEntryVal').setAttribute('x', ex.toFixed(1));
    $('foEntryVal').textContent = formatLongitudinalMetres(e.x);
    $('foExitLine').setAttribute('d', `M${xx.toFixed(1)} ${gy + 2}V${gy + 14}`);
    $('foExitText').setAttribute('x', xx.toFixed(1));
    $('foExitVal').setAttribute('x', xx.toFixed(1));
    $('foExitVal').textContent = formatLongitudinalMetres(x.x);
  }
  for (const id of ['foEntryLine', 'foEntryText', 'foEntryVal', 'foExitLine', 'foExitText', 'foExitVal']) {
    $(id).style.opacity = hasCross ? '1' : '0';
  }
  $('foNoTurf').style.opacity = (!hasCross && solved.hasTurfContact) ? '.8' : '0';

  /* ballposisjons-guide + måletag (kun under justering — handoffens regel) */
  $('foPositionGuide').setAttribute('d', `M${M.ballX.toFixed(1)} 207V257`);
  $('foMeasureTag').setAttribute('transform', `translate(${(M.ballX - 46).toFixed(1)} ${(ballY - 42).toFixed(1)})`);
  $('foMeasureText').textContent = formatLongitudinalCm(parameterState.ballPosition.value);
}

/* ── Scene: DTL — pinhole fra adapteren, mappet inn i handoffens ramme ─── */
const DTL_SWEEP = (78 * Math.PI) / 180;
function dtlCam() {
  return pinholeCamera(
    { pos: { x: -2.2, y: -0.9, z: 1.0 }, look: { x: 2.3, y: 0.25, z: 0.14 },
      fovDeg: 40, xStretch: 0.95, screenX: 10 },
    390, 330,
  );
}

function updateDtl() {
  const B = dtlCam();
  const P = p => projectPoint(p, B);

  const worldPts = arcWorldPoints(solved, 120, DTL_SWEEP);
  const proj = worldPts.map(P).filter(Boolean);
  if (proj.length > 1) {
    const d = proj.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join('');
    $('dtlArcPath').setAttribute('d', d);
    $('dtlArcGhost').setAttribute('d', d);
  }

  /* planet — kvadrat i svingplanet fra adapterens planePoint */
  const quad = [planePoint(solved, -1.25, -0.04), planePoint(solved, 3.2, -0.04),
    planePoint(solved, 3.2, 1.15), planePoint(solved, -1.25, 1.15)].map(P);
  if (quad.every(Boolean)) {
    $('dtlPlane').setAttribute('d',
      `M${quad[0].x.toFixed(1)} ${quad[0].y.toFixed(1)}L${quad[1].x.toFixed(1)} ${quad[1].y.toFixed(1)}L${quad[2].x.toFixed(1)} ${quad[2].y.toFixed(1)}L${quad[3].x.toFixed(1)} ${quad[3].y.toFixed(1)}Z`);
  }

  /* target-linje langs +x og retningsstråle (tangenten ved treff = club path) */
  const t0 = P({ x: -0.6, y: 0, z: 0 }), t1 = P({ x: 45, y: 0, z: 0 });
  if (t0 && t1) {
    $('dtlTargetLine').setAttribute('d', `M${t0.x.toFixed(1)} ${t0.y.toFixed(1)}L${t1.x.toFixed(1)} ${t1.y.toFixed(1)}`);
    $('dtlTargetText').setAttribute('x', t1.x.toFixed(1));
    $('dtlTargetText').setAttribute('y', (t1.y - 8).toFixed(1));
  }
  const imp = arcWorldPoint(solved, solved.thetaAtImpact);
  const tv = tangentWorld(solved, solved.thetaAtImpact);
  const n = Math.hypot(tv.x, tv.y, tv.z) || 1;
  const rayEnd = P({ x: imp.x + tv.x / n * 1.4, y: imp.y + tv.y / n * 1.4, z: imp.z + tv.z / n * 1.4 });
  const impP = P(imp);
  if (impP && rayEnd) {
    $('dtlDirectionRay').setAttribute('d', `M${impP.x.toFixed(1)} ${impP.y.toFixed(1)}L${rayEnd.x.toFixed(1)} ${rayEnd.y.toFixed(1)}`);
  }
  if (impP) {
    $('dtlImpactPoint').setAttribute('cx', impP.x.toFixed(1));
    $('dtlImpactPoint').setAttribute('cy', impP.y.toFixed(1));
    $('dtlClubGroup').setAttribute('transform', `translate(${(impP.x - 9).toFixed(1)} ${(impP.y - 4).toFixed(1)})`);
    $('dtlBallGroup').setAttribute('transform', `translate(${(impP.x + 4).toFixed(1)} ${(impP.y + 1).toFixed(1)})`);
  }

  const active = parameterState[activeKey];
  $('dtlMeasureText').textContent = `${active.label.toUpperCase()} ${railValue(activeKey, active)}`;
  const tagX = clamp((impP ? impP.x : 195) + 26, 14, 244);
  $('dtlMeasureTag').setAttribute('transform', `translate(${tagX.toFixed(1)} 108)`);
}

/* ── Hovedoppdatering: motor → avlesninger + scener ──────────────────── */
let prevLead = '';
function updateScene() {
  computeSolved();

  attackValue.textContent = formatAngle(solved.attackAngle, { signed: true });
  pathValue.textContent = formatAngle(solved.clubPath, { signed: true });

  /* strike-stripen: begge svar, alltid (U1/D3b). Leder som ord i D89-hue,
     mm-avviket med high/low-ord (D67), loftantagelsen som meta (D65). */
  const lead = solved.strikeLead;
  if (prevLead && lead !== prevLead) haptics.band('strike');
  prevLead = lead;
  $('strikeBandText').textContent = BAND_TEXT[lead];
  $('strikeBandText').style.color = BAND_HUE[lead];
  $('strikeOffsetText').textContent = formatFaceOffsetMm(solved.faceCentreOffsetMm);
  $('strikeMeta').innerHTML =
    `DYNAMIC LOFT ${formatAngle(DYNAMIC_LOFT[clubKey])}<span class="prov-chip">ASSUMED</span>`;

  updateFaceOn();
  updateDtl();

  const active = parameterState[activeKey];
  const [valPart, unitPart] = activeParts(activeKey);
  activeValue.textContent = valPart;
  activeUnit.textContent = unitPart;
  slider.setAttribute('aria-valuetext', railValue(activeKey, active));
}

function setCurrentView(view) {
  currentView = view === 'dtl' ? 'dtl' : 'fo';
  document.querySelectorAll('[data-canvas-view]').forEach(group =>
    group.toggleAttribute('hidden', group.dataset.canvasView !== currentView));
  document.querySelectorAll('.view-switch button').forEach(button =>
    button.setAttribute('aria-pressed', String(button.dataset.view === currentView)));
  scene.dataset.view = currentView;
  if (currentView === 'fo') {
    sceneTitle.textContent = `${CLUB_LABEL[clubKey]} face-on swing arc at impact`;
    sceneDesc.textContent = 'A face-on view of the club arc, golf ball, low point, turf entry and exit, and ground plane.';
  } else {
    sceneTitle.textContent = `${CLUB_LABEL[clubKey]} down-the-line plane and delivery`;
    sceneDesc.textContent = 'A down-the-line view of the swing plane, target line, club arc and impact relationship.';
  }
  updateScene();
  pulseView();
  setAdjusting();
  statusAnnouncer.textContent = `${currentView === 'fo' ? 'Face on' : 'Down the line'} view selected.`;
}

/* ── Hendelser ────────────────────────────────────────────────────────── */
let prevSliderVal = null;
slider.addEventListener('input', event => {
  const nv = Number(event.currentTarget.value);
  const p = parameterState[activeKey];
  if (prevSliderVal !== null) {
    if ((prevSliderVal < 0 && nv >= 0) || (prevSliderVal > 0 && nv <= 0)) haptics.tick('zero');
    else if ((nv <= p.min && prevSliderVal > p.min) || (nv >= p.max && prevSliderVal < p.max)) haptics.tick('end');
  }
  prevSliderVal = nv;
  p.value = nv;
  const fill = ((p.value - p.min) / (p.max - p.min)) * 100;
  slider.style.setProperty('--fill', `${fill}%`);
  updateScene();
  setAdjusting();
});
slider.addEventListener('pointerdown', setAdjusting);
slider.addEventListener('keydown', setAdjusting);
slider.addEventListener('change', () => {
  const active = parameterState[activeKey];
  statusAnnouncer.textContent =
    `${active.label} ${railValue(activeKey, active)}. Attack angle ${attackValue.textContent}. Club path ${pathValue.textContent}.`;
});

document.querySelectorAll('.view-switch button').forEach(button => {
  button.addEventListener('click', () => setCurrentView(button.dataset.view));
});

clubSelect.addEventListener('change', () => {
  clubKey = clubSelect.value;
  /* mockens preset-regel: plane følger kølla, fritt justerbar etterpå */
  parameterState.swingPlane.value = PLANE_PRESET[clubKey];
  haptics.impact('light');
  syncInstrument();
  renderRail();
  setCurrentView(currentView);
  statusAnnouncer.textContent = `${CLUB_LABEL[clubKey]} selected.`;
});

lieSelect.addEventListener('change', () => {
  lieKey = lieSelect.value;
  haptics.tick('lie');
  updateScene();
  setAdjusting();
  statusAnnouncer.textContent = `${LIE_LABEL[lieKey]}, ${formatLieMm(LIE_PRESETS[lieKey])} lie selected.`;
});

$('resetButton').addEventListener('click', () => {
  Object.keys(parameterState).forEach(key => parameterState[key].value = defaults[key].value);
  activeKey = 'ballPosition';
  clubKey = 'midIron'; clubSelect.value = 'midIron';
  lieKey = 'fairway'; lieSelect.value = 'fairway';   /* D138 */
  haptics.impact('light');
  syncInstrument();
  renderRail();
  setCurrentView('fo');
  setAdjusting();
});

/* Escape = HOME (N-h) */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') window.location.href = document.body.dataset.home;
});

syncInstrument();
renderRail();
setCurrentView('fo');

/* Handoffens test-API — bevart per akseptkontrakten (view-settet er fo/dtl
   etter eierbeslutningen om å droppe strike-viewet). */
window.__impactStudio = {
  getState: () => ({ activeKey, currentView, club: CLUB_LABEL[clubKey], lie: lieKey,
    parameters: Object.fromEntries(Object.entries(parameterState).map(([key, v]) => [key, v.value])) }),
  setView: setCurrentView,
  selectParameter: switchParameter,
  setTheme,
  getTheme: () => document.documentElement.dataset.theme,
};

/* Strøm E-sømmen (window.__studio) — nøkkelmapping fra landskapskontrakten.
   setInspect-aliaset er FJERNET etter E-grønt (D141-porten lukket; E sin
   portrettvert kaller den ikke) — varslet før fjerning, som avtalt. */
const KEY_MAP = { plane: 'swingPlane', dir: 'swingDirection', low: 'ballPosition', arc: 'arcHeight' };
window.__studio = {
  get state() {
    return { plane: parameterState.swingPlane.value, dir: parameterState.swingDirection.value,
      low: parameterState.ballPosition.value, arc: parameterState.arcHeight.value,
      club: clubKey, lie: lieKey, view: currentView };
  },
  get solved() { return solved; },
  applyStudio({ plane, dir, low, arc, club, lie }) {
    if (plane !== undefined) parameterState.swingPlane.value = plane;
    if (dir !== undefined) parameterState.swingDirection.value = dir;
    if (low !== undefined) parameterState.ballPosition.value = low;
    if (arc !== undefined) parameterState.arcHeight.value = arc;
    if (club !== undefined) { clubKey = club; clubSelect.value = club; }
    if (lie !== undefined) { lieKey = lie; lieSelect.value = lie; }
    syncInstrument(); renderRail(); updateScene();
  },
  selectParam(key) {
    if (key === 'lie') { lieSelect.focus(); return; }
    switchParameter(KEY_MAP[key] || key);
  },
  reset() { $('resetButton').click(); },
};

/* D56 — onboardingen monteres OPPÅ skjermen. Er den ikke i gang, skjer intet. */
Promise.all([
  import('../onboarding/onboarding.js'),
  import('../onboarding/host-studio.js'),
]).then(([ob, host]) => ob.mountOnboarding(host.studioHost(window.__studio))).catch(() => {});
</script>
