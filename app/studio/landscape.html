<script type="module">
/* ============================================================
 * MOTOR — engine/studioSolve (D13: mockens motorfil er IKKE portert).
 * All projeksjon/interpolasjon av motortall: adapter/studioShape (D61/D62).
 * All formatering: adapter (D28/D29/D67). Ingen trig i denne fila —
 * rotasjoner gjøres med enhetsvektor-transformer (fysikklinten står).
 * Farger konsumeres via tokens (CSS()/tint()) — naken hex kun for
 * scene-materiale uten token (gress, jord, dusk), meldt i STUDIO.md.
 * ============================================================ */
import { studioSolve, CLUB_GEOMETRY, LIE_PRESETS } from '../../engine/src/studioSolve.js';
import { studioRadius, studioBallPositionOffsetCm } from '../../engine/src/constants.js';
import {
  arcWorldPoint, arcWorldPoints, tangentWorld, planePoint,
  faceOnArcPoints, pinholeCamera, projectPoint,
} from '../../adapter/src/studioShape.js';
import { directionRay } from '../../adapter/src/traceShape.js';
import { formatAngle } from '../../adapter/src/format.js';
import {
  formatLongitudinalCm, formatHeightCm, formatFaceOffsetMm, formatLieMm,
} from '../../adapter/src/displayStudio.js';
import haptics from './sa-haptics.js';

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const RADIUS = studioRadius;                     // 1.20 m — motorens konstant
const SWEEP_RAD = (48 * Math.PI) / 180;          // mockens tegnespenn (komposisjon)

/* Token-oppslag for canvas: CSS(navn) gir hex, tint(navn, a) en rgba. */
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const RGBC = {};
function rgbOf(token){
  if (!RGBC[token]){
    const h = CSS(token).replace('#', '');
    RGBC[token] = parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16)
      + ',' + parseInt(h.slice(4, 6), 16);
  }
  return RGBC[token];
}
const tint = (token, a) => 'rgba(' + rgbOf(token) + ',' + a + ')';

/* ============================================================ STATE */
const PARAMS = {
  /* AVVIK (D28, arvet): vinkler 1 desimal også på plane (mocken viste 0). */
  plane: { min:30,  max:80, step:0.5, def:60,   bipolar:false, hue:'var(--plane)',
           fmt:v=>formatAngle(v) },
  dir:   { min:-12, max:12, step:0.1, def:0,    bipolar:true,  hue:'var(--path)',
           fmt:v=>formatAngle(v, { signed:true }) },
  /* AVVIK (D67, arvet): avstander bærer ord, aldri nakent fortegn. */
  low:   { min:-20, max:20, step:0.1, def:0,    bipolar:true,  hue:'var(--primary)',
           fmt:formatLongitudinalCm },
  arc:   { min:-5,  max:5,  step:0.1, def:0,    bipolar:true,  hue:'var(--depth)',
           fmt:formatHeightCm },
  /* AVVIK (D93, tidl. D82): lie er en STEGSLIDER låst til de sju LIE_PRESETS-punktene —
     aldri fri mm. Verdien er indeksen; navnet byttes øyeblikkelig ved steg.
     D95: ingen parameterkulør — nøytral ink. */
  lie:   { min:0,   max:6,  step:1,   def:0,    bipolar:false, hue:'var(--ink)',
           fmt:i=>LIES[Math.round(i)].label },
};
const PARAM_LABELS = { plane:'Swing plane', dir:'Swing direction', low:'Ball position',
                       arc:'Arc height', lie:'Lie' };
const LP_STANCE = studioBallPositionOffsetCm;    // cm foran stance-senter (motorens Pure-ideal)

/* AVVIK (D65): tre køller med fast dynamisk loft merket som antagelse.
   3-wood-planpreset 55° eierlåst. AVVIK (D17b): ARC_Z0/zClub fjernet;
   SWEET fra CLUB_GEOMETRY. */
const CLUB_SEQ = ['driver', 'threeWood', 'midIron'];
const CLUB_LABEL = { driver:'DRIVER', threeWood:'3-WOOD', midIron:'MID-IRON' };
const DYNAMIC_LOFT = { driver:12.5, threeWood:15.0, midIron:31.0 };
const PLANE_PRESET = { driver:50, threeWood:55, midIron:60 };
const HEAD_MM = { driver:96, threeWood:68, midIron:102 };
const HEAD_IMG = { driver:'driverHead', threeWood:'driverHead', midIron:'ironHead' };
const LEAN = { driver:0, threeWood:2 * Math.PI / 180, midIron:6 * Math.PI / 180 };

const LIES = [
  { key:'hardpan',    label:'HARDPAN' },
  { key:'tight',      label:'TIGHT' },
  { key:'fairway',    label:'FAIRWAY' },
  { key:'lightRough', label:'LIGHT ROUGH' },
  { key:'rough',      label:'ROUGH' },
  { key:'tee',        label:'TEE' },
  { key:'teeHigh',    label:'HIGH TEE' },
];
const lieLabel = k => LIES.find(l => l.key === k).label;
const lieIndex = k => LIES.findIndex(l => l.key === k);

const state = { view:'face', sel:'low', plane:60, dir:0, low:0, arc:0,
                club:'midIron', lie:'hardpan', inspect:false };
const ballLift = () => LIE_PRESETS[state.lie] / 1000;   // meter

let solved = null;
function computeSolved(){
  solved = studioSolve({
    swingPlane: state.plane,
    swingDirection: state.dir,
    ballPositionCm: state.low,
    arcHeightCm: state.arc,
    lieHeightMm: LIE_PRESETS[state.lie],
    club: CLUB_GEOMETRY[state.club],
    dynamicLoftDeg: DYNAMIC_LOFT[state.club],
  });
}
computeSolved();

/* AVVIK (F7/D17b/U1): standin-bånd → strikeBand v2: begge svar, alltid.
   D89-kvalitetsskala: Pure/Centre → good · Thin/Fat/High/Low → strike-gull
   · Duff/Whiff/off-face → bad. Ordet er bæreren, fargen forsterker (D10). */
const BAND_TEXT = { Duff:'DUFF', Fat:'FAT', Pure:'PURE', Thin:'THIN', Whiff:'WHIFF',
                    OffFace:'OFF FACE', Low:'LOW', Centre:'CENTRE', High:'HIGH' };
const BAND_LEVEL = { Pure:'--good', Centre:'--good',
                     Thin:'--strike', Fat:'--strike', High:'--strike', Low:'--strike',
                     Duff:'--bad', Whiff:'--bad', OffFace:'--bad' };

/* Presentation-only anchor for the reference clubhead (mockens regel). */
function ghostClubAnchor(){
  const t0g = solved.groundCrossingTheta0;
  if (t0g !== null){
    const entry = arcWorldPoint(solved, -t0g);
    if (entry.x < -0.001) return { mode:'entry', point:entry };
  }
  return { mode:'impact', point:{ x:0, y:0, z:solved.clubHeightM } };
}

/* ============================================================ DOM */
const $ = id => document.getElementById(id);
const cv = $('scene'), ctx = cv.getContext('2d');
let DPR = 1, W = 0, H = 0;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  IW = 0;
  syncOrientation?.();
  layoutSlider(); kick();
}
let syncOrientation = null;
addEventListener('resize', resize);
if (typeof ResizeObserver === 'function'){
  const ro = new ResizeObserver(() => resize());
  ro.observe($('stage'));
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) requestAnimationFrame(() => resize());
});
addEventListener('pageshow', () => requestAnimationFrame(() => resize()));

/* Escape = HOME (N-h, låst navigasjon) */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') window.location.href = document.body.dataset.home;
});

/* outcome feedback: pulse only what changed */
let prevOut = null, pulseTimer = 0, prevBand = '';
function updateOutcomes(){
  const out = { attack: solved.attackAngle, path: solved.clubPath,
                strike: solved.faceCentreOffsetMm };
  /* AVVIK (D29, arvet): retningsbærende vinkler bærer fortegn, også + */
  $('vAttack').textContent = formatAngle(out.attack, { signed:true });
  $('vPath').textContent = formatAngle(out.path, { signed:true });

  const lead = solved.strikeLead;
  if (prevBand && lead !== prevBand) haptics.band('strike');
  prevBand = lead;
  const qEl = $('insetQual');
  qEl.textContent = BAND_TEXT[lead];
  qEl.style.color = 'var(' + BAND_LEVEL[lead] + ')';
  /* AVVIK (D67, arvet): mm 1 desimal med high/low-ord — ordet er også flatesvaret */
  $('insetMm').textContent = formatFaceOffsetMm(solved.faceCentreOffsetMm);
  /* D3b-kontekstraden (D93: lie-navn fast, mm caption) + D65-loft i maksimert */
  $('insetCtx').innerHTML = `${CLUB_LABEL[state.club]} &middot; ${lieLabel(state.lie)} `
    + `<span class="mmv">${formatLieMm(LIE_PRESETS[state.lie])}</span>`;
  $('insetLoft').innerHTML = ` &middot; DYNAMIC LOFT ${formatAngle(DYNAMIC_LOFT[state.club])}`
    + `<span class="prov-chip">ASSUMED</span>`;

  if (prevOut){
    const changed = {
      attack: Math.abs(out.attack - prevOut.attack) > 0.005,
      path:   Math.abs(out.path   - prevOut.path)   > 0.005,
      strike: Math.abs(out.strike - prevOut.strike) > 0.05,
    };
    const any = changed.attack || changed.path || changed.strike;
    for (const k of ['attack','path']){
      const el = $('card' + k[0].toUpperCase() + k.slice(1));
      el.classList.toggle('hit', changed[k]);
      el.classList.toggle('dim', any && !changed[k]);
    }
    $('inset').classList.toggle('hit', changed.strike);
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => {
      for (const k of ['attack','path'])
        $('card' + k[0].toUpperCase() + k.slice(1)).classList.remove('hit','dim');
      $('inset').classList.remove('hit');
    }, 320);
  }
  prevOut = out;
}

/* cross-view hint: the change is clearer in the other perspective */
let hintTimer = 0;
function crossViewHint(){
  const other = (state.sel === 'dir' || state.sel === 'plane') ? 'dtl' : 'face';
  if (state.view === other) return;
  const btn = $('btnView');
  if (btn.classList.contains('pulse')) return;
  btn.classList.add('pulse');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => btn.classList.remove('pulse'), 240);
}

/* ============================================================ SLIDER */
const range = $('range'), fillEl = $('fill'), notchEl = $('notch');
function layoutSlider(){
  const p = PARAMS[state.sel];
  const zone = range.parentElement.getBoundingClientRect();
  const inner = zone.width - 26;                // 13px inset each side (thumb radius)
  const frac = v => (v - p.min) / (p.max - p.min);
  const px = v => 13 + frac(v) * inner;
  const vNow = state.sel === 'lie' ? lieIndex(state.lie) : state[state.sel];
  if (p.bipolar){
    notchEl.style.display = 'block';
    notchEl.style.left = (px(0) - 1) + 'px';
    const a = px(Math.min(0, vNow)), b = px(Math.max(0, vNow));
    fillEl.style.left = a + 'px'; fillEl.style.width = Math.max(2, b - a) + 'px';
  } else {
    notchEl.style.display = 'none';
    fillEl.style.left = '13px'; fillEl.style.width = Math.max(2, px(vNow) - 13) + 'px';
  }
}
function sliderValueText(){
  if (state.sel === 'lie')
    return lieLabel(state.lie) + ' · ' + formatLieMm(LIE_PRESETS[state.lie]);
  return PARAMS[state.sel].fmt(state[state.sel]);
}
function selectParam(key){
  state.sel = key;
  const p = PARAMS[key];
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.p === key));
  document.querySelector('.sliderZone').style.setProperty('--slider-hue', p.hue);
  range.min = p.min; range.max = p.max; range.step = p.step;
  range.value = key === 'lie' ? lieIndex(state.lie) : state[key];
  range.setAttribute('aria-label', PARAM_LABELS[key]);
  range.setAttribute('aria-valuetext', sliderValueText());
  prevSliderVal = parseFloat(range.value);
  layoutSlider(); kick();
}
document.querySelectorAll('.chip').forEach(c =>
  c.addEventListener('click', () => { haptics.tick('chip'); selectParam(c.dataset.p); }));
let prevSliderVal = null;
range.addEventListener('input', () => {
  const nv = parseFloat(range.value);
  const p = PARAMS[state.sel];
  if (prevSliderVal !== null){
    if (state.sel === 'lie'){
      /* D93: stegslider — hvert stegskifte er en detent */
      if (nv !== prevSliderVal) haptics.tick('lie-step');
    } else if (p.bipolar && ((prevSliderVal < 0 && nv >= 0) || (prevSliderVal > 0 && nv <= 0)))
      haptics.tick('zero');
    else if ((nv <= p.min && prevSliderVal > p.min) || (nv >= p.max && prevSliderVal < p.max))
      haptics.tick('end');
  }
  prevSliderVal = nv;
  if (state.sel === 'lie') state.lie = LIES[Math.round(nv)].key;
  else state[state.sel] = nv;
  range.setAttribute('aria-valuetext', sliderValueText());
  vecFlashAt = performance.now();
  computeSolved();
  updateChipValues(); layoutSlider(); updateOutcomes(); crossViewHint(); kick();
});
function updateChipValues(){
  $('cvPlane').textContent = PARAMS.plane.fmt(state.plane);
  $('cvDir').textContent = PARAMS.dir.fmt(state.dir);
  $('cvLow').textContent = PARAMS.low.fmt(state.low);
  $('cvArc').textContent = PARAMS.arc.fmt(state.arc);
  $('cvLie').textContent = lieLabel(state.lie);
}
$('resetBtn').addEventListener('click', () => {
  /* Reset = det dokumenterte eksemplet (spec 03 regel 5): parametre + lie;
     kølla står (mockens oppførsel), plane følger køllas preset. */
  for (const k of ['plane','dir','low','arc']) state[k] = PARAMS[k].def;
  state.plane = PLANE_PRESET[state.club];
  state.lie = 'hardpan';
  range.value = state.sel === 'lie' ? lieIndex(state.lie) : state[state.sel];
  range.setAttribute('aria-valuetext', sliderValueText());
  haptics.impact('light');
  vecFlashAt = performance.now();
  computeSolved();
  updateChipValues(); layoutSlider(); updateOutcomes(); kick();
});
function setClub(c){
  state.club = c;
  state.plane = PLANE_PRESET[c];              // auto-preset; freely adjustable after
  /* AVVIK (D17b): arc height er absolutt — mockens nullstilling ved bytte utgår */
  $('clubCap').textContent = CLUB_LABEL[c];
  if (state.sel === 'plane') range.value = state.plane;
  range.setAttribute('aria-valuetext', sliderValueText());
  vecFlashAt = performance.now();
  computeSolved();
  updateChipValues(); layoutSlider(); updateOutcomes(); kick();
}
$('btnClub').addEventListener('click', () => {
  haptics.impact('light');
  setClub(CLUB_SEQ[(CLUB_SEQ.indexOf(state.club) + 1) % CLUB_SEQ.length]);
});
$('btnView').addEventListener('click', () => { haptics.impact('light'); setView(state.view === 'face' ? 'dtl' : 'face'); });
$('btnContact').addEventListener('click', () => {
  setInspect(!state.inspect);
  haptics.impact('light');
});
$('insetMax').addEventListener('click', () => {
  setInspect(!state.inspect);
  haptics.impact('light');
});
function setInspect(on){
  state.inspect = on;
  $('inset').classList.toggle('inset--max', on);
  $('insetMax').innerHTML = on ? '&#x2921;' : '&#x2922;';
  $('insetMax').setAttribute('aria-label', on ? 'Close Strike contact zone' : 'Open Strike contact zone');
  $('btnContact').setAttribute('aria-expanded', String(on));
  $('btnContact').setAttribute('aria-label', on ? 'Close Strike contact zone' : 'Open Strike contact zone');
  $('btnContact').classList.toggle('contact-active', on);
  IW = 0;                                       // re-measure the inset canvas
  kick();
}
let viewToastTimer = 0, viewToastHideTimer = 0;
function showViewToast(label){
  const toast = $('viewToast');
  clearTimeout(viewToastTimer); clearTimeout(viewToastHideTimer);
  toast.textContent = label;
  toast.hidden = false;
  toast.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => toast.classList.add('is-visible'));
  viewToastTimer = setTimeout(() => {
    toast.classList.remove('is-visible');
    toast.setAttribute('aria-hidden', 'true');
    viewToastHideTimer = setTimeout(() => { toast.hidden = true; }, 190);
  }, 620);
}
function setView(v){
  const changed = state.view !== v;
  state.view = v;
  if (v === 'dtl' && state.inspect) setInspect(false);   // inspeksjon er Face On-eid
  $('camG').style.transform = v === 'face' ? 'rotate(-90deg)' : 'rotate(0deg)';
  $('viewCap').textContent = v === 'face' ? 'DTL' : 'FO';
  $('btnView').setAttribute('aria-label', v === 'face' ? 'Switch to Down the line' : 'Switch to Face on');
  $('stage').dataset.view = v;
  if (changed) showViewToast(v === 'face' ? 'FACE ON' : 'DOWN THE LINE');
  applyStageBg();
  vecFlashAt = performance.now();          // brief orientation flash on view switch
  kick();
}

/* ============================================================ RENDER LOOP */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let animStart = 0, rafId = 0;
function kick(){
  animStart = performance.now();
  cancelAnimationFrame(rafId);
  if (REDUCED) {
    draw(1);
    return;
  }
  const loop = now => {
    draw(clamp((now - animStart) / 400, 0, 1));
    if (now - animStart < 1750) rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}

function draw(t){
  ctx.clearRect(0, 0, W, H);
  $('stage').dataset.ghostAnchor = ghostClubAnchor().mode;
  if (state.view === 'face') drawFace(t);
  else drawDtl(t);
  drawInset();                                  // contact preview remains available in both views
}

/* transient outcome vectors: full for ~900 ms after a parameter change */
let vecFlashAt = -1e9;
function flashAlpha(){
  if (REDUCED) return 0;
  const dt = performance.now() - vecFlashAt;
  return dt < 900 ? 1 : clamp(1 - (dt - 900) / 700, 0, 1);
}

/* ============================================================ ASSETS
 * Eierens materialplater — fullt sett tilbake per D82/D88. */
const ASSETS = {
  turf:       './assets/turf.png',
  skyFace:    './assets/sky-face.png',
  bgDtl:      './assets/bg-dtl.png',
  ball:       './assets/ball.png',
  glint:      './assets/glint.png',
  tee:        './assets/tee.png',
  ironHead:   './assets/iron-head.png',
  driverHead: './assets/driver-head.png',
};
const IMG = {};
for (const k in ASSETS){
  const im = new Image();
  im.onload = () => { applyStageBg(); kick(); };
  im.src = ASSETS[k];
  IMG[k] = im;
}
const ready = k => IMG[k] && IMG[k].complete && IMG[k].naturalWidth > 0;
function applyStageBg(){
  /* mockens dusk-vask over Higgsfield-platene (scene-materiale) */
  const st = document.getElementById('stage');
  if (state.view === 'face' && ready('skyFace'))
    st.style.background = 'linear-gradient(180deg, rgba(14,10,24,.9) 0%, rgba(36,21,54,.5) 55%, rgba(15,11,28,.92) 100%), url(' + ASSETS.skyFace + ') center/cover no-repeat var(--neutral)';
  else if (state.view === 'dtl' && ready('bgDtl'))
    st.style.background = 'linear-gradient(180deg, rgba(14,10,24,.85) 0%, rgba(36,21,54,.45) 55%, rgba(15,11,28,.9) 100%), url(' + ASSETS.bgDtl + ') center/cover no-repeat var(--neutral)';
  else st.style.background = '';
}

/* outcome segment: the arc itself, lit up through the ball — white-hot core
 * over a token-hued glow (mockens tegning, D88). Chevron-strøm langs
 * tangenten; rotasjon via enhetsvektor, aldri trig. */
function litSegment(pts, hue, fa, impactIdx){
  if (pts.length < 2 || fa <= 0.01) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const strokePts = () => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  };
  const TS = W >= 700 ? 1.6 : 1.3;           // transient-oppskalering (telefonlesbarhet)
  ctx.globalAlpha = 0.38 * fa; ctx.strokeStyle = hue; ctx.lineWidth = 11 * TS; strokePts();
  /* white-hot core with a soft tapering tip */
  const cut = Math.max(2, Math.floor(pts.length * 0.72));
  const main = pts.slice(0, cut + 1), tail = pts.slice(cut);
  const strokeSub = arr => {
    ctx.beginPath();
    arr.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  };
  ctx.globalAlpha = fa; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * TS; strokeSub(main);
  ctx.globalAlpha = 0.7 * fa; ctx.lineWidth = 2 * TS; strokeSub(tail);
  /* arrow stream out of the strike point */
  const ray = pts.slice(Math.max(0, Math.min(impactIdx ?? pts.length - 11, pts.length - 2)));
  if (ray.length > 1){
    const chevron = (x, y, ux, uy, al) => {
      ctx.save(); ctx.translate(x, y); ctx.transform(ux, uy, -uy, ux, 0, 0); ctx.scale(TS, TS);
      ctx.globalAlpha = al;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = hue; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-6, -5.5); ctx.lineTo(2, 0); ctx.lineTo(-6, 5.5); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-5, -4.3); ctx.lineTo(1.6, 0); ctx.lineTo(-5, 4.3); ctx.stroke();
      ctx.restore();
    };
    const at = u => {
      const fi = clamp(u, 0, 1) * (ray.length - 1);
      const i0 = Math.min(Math.floor(fi), ray.length - 2), fr = fi - i0;
      const a = ray[i0], b = ray[i0 + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: a.x + dx * fr, y: a.y + dy * fr, ux: dx / len, uy: dy / len };
    };
    if (REDUCED){
      const c = at(0.55);
      chevron(c.x, c.y, c.ux, c.uy, 0.8 * fa);
    } else {
      const phase = ((performance.now() - vecFlashAt) / 700) % 1;
      for (let k = 0; k < 3; k++){
        const u = (phase + k / 3) % 1;
        const al = fa * (1 - u) * 0.95;
        if (al <= 0.03) continue;
        const c = at(u);
        chevron(c.x, c.y, c.ux, c.uy, al);
      }
    }
  }
  ctx.restore();
}

/* scene clip: everything in the main canvas is drawn OUTSIDE the inset rect */
function sceneClipPath(){
  const r = cv.getBoundingClientRect();
  const i = document.getElementById('inset').getBoundingClientRect();
  const p = new Path2D();
  p.rect(0, 0, W, H);
  if (i.width > 0)
    p.rect(i.left - r.left - 6, i.top - r.top - 6, i.width + 12, i.height + 12);
  return p;
}

/* ============================================================ MINISKJERM
 * Zoomed contact zone (entry→exit) i strike-gull-språket (D84: gull = treffbånd). */
const icv = document.getElementById('insetCv'), ictx = icv.getContext('2d');
let IW = 0, IH = 0;
function resizeInset(){
  const r = icv.getBoundingClientRect();
  IW = Math.round(r.width); IH = Math.round(r.height);
  icv.width = IW * DPR; icv.height = IH * DPR;
  ictx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function drawInset(){
  if (!IW) resizeInset();
  const t0g = solved.groundCrossingTheta0;
  const lpx = solved.effectiveLowPointX;
  const BALL_R = solved.ballRadiusM;
  const sweetM = solved.sweetSpotHeightMm / 1000;
  const clubZ = solved.clubHeightM;
  const GOLD = CSS('--strike'), WARM = CSS('--primary'), LOW = CSS('--attack');
  ictx.clearRect(0, 0, IW, IH);

  /* world window: adaptive — always frames the whole contact zone */
  let x0 = -0.08, x1 = 0.24;
  if (t0g !== null){
    x0 = Math.min(x0, arcWorldPoint(solved, -t0g).x - 0.04);
    x1 = Math.max(x1, arcWorldPoint(solved, t0g).x + 0.05);
  }
  if (state.inspect){
    const mid = (x0 + x1) / 2, half = Math.max(0.27, (x1 - x0) * 0.62);
    x0 = mid - half; x1 = mid + half;
  }
  const sc = IW / (x1 - x0);
  const gy = IH * 0.66;
  const EXAG = 6, CAP = 0.035;
  const X = xm => (xm - x0) * sc;
  const Y = zm => gy - (zm >= 0 ? zm : -CAP * Math.tanh(-zm * EXAG / CAP)) * sc;

  /* ground: grass on top, soil underneath (materialplate når lastet) */
  {
    if (ready('turf')){
      ictx.drawImage(IMG.turf, 0, 0, IMG.turf.naturalWidth, IMG.turf.naturalHeight,
                     0, gy - 1, IW, (IH - gy) + 1);
      ictx.fillStyle = 'rgba(7,6,12,.42)';
      ictx.fillRect(0, gy - 1, IW, (IH - gy) + 1);
    }
    const soil = ictx.createLinearGradient(0, gy, 0, IH);
    soil.addColorStop(0, 'rgba(61,43,26,' + (ready('turf') ? 0.25 : 1) + ')');
    soil.addColorStop(1, 'rgba(26,18,12,' + (ready('turf') ? 0.3 : 1) + ')');
    ictx.fillStyle = soil; ictx.fillRect(0, gy, IW, IH - gy);
    const grass = ictx.createLinearGradient(0, gy, 0, gy + 5);
    grass.addColorStop(0, '#3f6b2e'); grass.addColorStop(1, '#2a4a22');
    ictx.fillStyle = grass; ictx.fillRect(0, gy, IW, 5);
    ictx.strokeStyle = 'rgba(200,225,150,.5)'; ictx.lineWidth = 1;
    ictx.beginPath(); ictx.moveTo(0, gy); ictx.lineTo(IW, gy); ictx.stroke();
  }

  /* divot */
  if (t0g !== null){
    const seg = arcWorldPoints(solved, 22, t0g);
    ictx.beginPath();
    ictx.moveTo(X(seg[0].x), gy);
    for (const p of seg) ictx.lineTo(X(p.x), Y(p.z));
    ictx.lineTo(X(seg[seg.length - 1].x), gy); ictx.closePath();
    ictx.fillStyle = 'rgba(24,15,8,.9)'; ictx.fill();
    ictx.strokeStyle = 'rgba(205,142,78,.85)'; ictx.lineWidth = 1.5; ictx.stroke();
  }

  /* Reference clubhead: turf-before-ball moves it to ENTRY; otherwise impact. */
  {
    const hk = HEAD_IMG[state.club];
    if (ready(hk)){
      const im = IMG[hk];
      const brH = BALL_R * sc;
      const hPxI = HEAD_MM[state.club] * (brH / (BALL_R * 1000));
      const wPxI = hPxI * (im.naturalWidth / im.naturalHeight);
      const ghost = ghostClubAnchor();
      const yBI = Y(ghost.point.z), xRI = X(ghost.point.x) - brH * 0.92;
      ictx.save(); ictx.globalAlpha = 0.5;
      ictx.translate(xRI, yBI); ictx.rotate(LEAN[state.club]);
      ictx.drawImage(im, -wPxI, -hPxI, wPxI, hPxI);
      ictx.restore();
    }
  }

  /* gold arc through the zone (glow pass + warm core — mockens språk, D88) */
  {
    const thWin = 0.42;
    const seg = arcWorldPoints(solved, 90, thWin);
    for (const pass of [ [tint('--primary', 0.16), 8], [null, 2.6] ]){
      ictx.save(); ictx.lineCap = 'round';
      if (pass[0]) ictx.strokeStyle = pass[0];
      else {
        const g = ictx.createLinearGradient(0, 0, IW, 0);
        g.addColorStop(0, '#fdf3e0'); g.addColorStop(0.55, GOLD); g.addColorStop(1, WARM);
        ictx.strokeStyle = g;
      }
      ictx.lineWidth = pass[1];
      ictx.beginPath();
      let st = false;
      for (const p of seg){
        const px = X(p.x), py = Y(p.z);
        if (px < -30 || px > IW + 30){ st = false; continue; }
        if (!st){ ictx.moveTo(px, py); st = true; } else ictx.lineTo(px, py);
      }
      ictx.stroke(); ictx.restore();
    }
  }

  /* ball (driver-lie: on the tee) + ember halo (mock, D88) */
  const liftI = ballLift();
  const br = BALL_R * sc, bx2 = X(0), by2 = Y(liftI) - br;
  if (liftI > 0){
    const tTop2 = by2 + br * 0.9, tH2 = gy - tTop2;
    const isTee = state.lie === 'tee' || state.lie === 'teeHigh';
    if (isTee && ready('tee') && tH2 > 4){
      const tW2 = tH2 * (IMG.tee.naturalWidth / IMG.tee.naturalHeight);
      ictx.drawImage(IMG.tee, bx2 - tW2 / 2, tTop2, tW2, tH2);
    } else if (isTee){
      ictx.save();
      ictx.strokeStyle = 'rgba(210,205,225,.6)'; ictx.lineCap = 'round';
      ictx.lineWidth = 2.5;
      ictx.beginPath(); ictx.moveTo(bx2, gy); ictx.lineTo(bx2, by2 + br * 0.9); ictx.stroke();
      ictx.restore();
    } else {
      /* AVVIK (D66/D93): gress-lie — ballen sitter oppå strå, ikke pigg */
      ictx.save();
      ictx.strokeStyle = 'rgba(130,185,85,.8)'; ictx.lineWidth = 1.4; ictx.lineCap = 'round';
      for (const o of [-4, 0, 4]){
        ictx.beginPath(); ictx.moveTo(bx2 + o, gy);
        ictx.lineTo(bx2 + o * 0.6, by2 + br * 0.85); ictx.stroke();
      }
      ictx.restore();
    }
  }
  {
    const gr2 = br * 1.9;
    const halo2 = ictx.createRadialGradient(bx2, by2, br * 0.4, bx2, by2, gr2);
    halo2.addColorStop(0, tint('--strike', 0.28));
    halo2.addColorStop(0.5, tint('--primary', 0.13));
    halo2.addColorStop(1, tint('--primary', 0));
    ictx.beginPath(); ictx.arc(bx2, by2, gr2, 0, Math.PI * 2);
    ictx.fillStyle = halo2; ictx.fill();
  }
  if (ready('ball')){
    ictx.drawImage(IMG.ball, bx2 - br - 1, by2 - br - 1, (br + 1) * 2, (br + 1) * 2);
  } else {
    ictx.beginPath(); ictx.arc(bx2, by2, br, 0, Math.PI * 2);
    const bg2 = ictx.createRadialGradient(bx2 - br*0.3, by2 - br*0.35, br*0.15, bx2, by2, br);
    bg2.addColorStop(0, 'rgba(255,255,255,.9)'); bg2.addColorStop(1, 'rgba(210,203,224,.55)');
    ictx.fillStyle = bg2; ictx.fill();
    ictx.strokeStyle = 'rgba(245,242,255,.9)'; ictx.lineWidth = 1.5; ictx.stroke();
  }

  /* kontakt-blush: ballen "husker" hvor den ble truffet */
  {
    const fa2 = flashAlpha();
    const dyC = clamp(((clubZ + sweetM) - (liftI + BALL_R)) * (br / BALL_R),
                      -br * 0.85, br * 0.85);
    const cyB = by2 - dyC;
    const cxB = bx2 - Math.sqrt(Math.max(0, br * br - dyC * dyC)) * 0.9;
    const rB = br * 0.55;
    const gB = ictx.createRadialGradient(cxB, cyB, 0, cxB, cyB, rB);
    const aB = 0.26 + 0.42 * fa2;
    gB.addColorStop(0, 'rgba(255,196,120,' + aB.toFixed(3) + ')');
    gB.addColorStop(0.45, tint('--primary', +(aB * 0.55).toFixed(3)));
    gB.addColorStop(1, tint('--primary', 0));
    ictx.save();
    ictx.beginPath(); ictx.arc(bx2, by2, br, 0, Math.PI * 2); ictx.clip();
    ictx.fillStyle = gB;
    ictx.beginPath(); ictx.arc(cxB, cyB, rB, 0, Math.PI * 2); ictx.fill();
    ictx.restore();
  }

  /* strike-location reference on the ghosted face: ember dot = ball centre
     against the face; faint notch = sweetspot (CLUB_GEOMETRY, D17b) */
  if (ready(HEAD_IMG[state.club])){
    const fxI = bx2 - br * 0.92;
    const yCtI = by2;
    const ySwI = by2 - ((clubZ + sweetM) - (liftI + BALL_R)) * (br / BALL_R);
    ictx.save();
    ictx.strokeStyle = 'rgba(245,242,255,.5)'; ictx.lineWidth = 1.5;
    ictx.beginPath(); ictx.moveTo(fxI - 7, ySwI); ictx.lineTo(fxI + 1, ySwI); ictx.stroke();
    ictx.beginPath(); ictx.arc(fxI, yCtI, 2.6, 0, Math.PI * 2);
    ictx.fillStyle = tint('--primary', 0.95); ictx.fill();
    ictx.strokeStyle = 'rgba(255,255,255,.75)'; ictx.lineWidth = 1; ictx.stroke();
    ictx.restore();
  }

  /* strike height: warm tick + mm bracket (gull = treffbånd, D84) */
  const czI = clamp(clubZ + sweetM, liftI, liftI + 2 * BALL_R);
  const sy = Y(czI);
  ictx.strokeStyle = WARM; ictx.lineWidth = 2;
  ictx.beginPath(); ictx.moveTo(bx2 - br - 5, sy); ictx.lineTo(bx2 + br + 5, sy); ictx.stroke();
  const cyy = by2, bxr = bx2 + br + 11;
  ictx.strokeStyle = tint('--strike', 0.8); ictx.lineWidth = 1.5;
  ictx.beginPath(); ictx.moveTo(bxr, cyy); ictx.lineTo(bxr, sy); ictx.stroke();
  ictx.beginPath(); ictx.moveTo(bxr - 3.5, cyy); ictx.lineTo(bxr + 3.5, cyy); ictx.stroke();
  ictx.beginPath(); ictx.moveTo(bxr - 3.5, sy); ictx.lineTo(bxr + 3.5, sy); ictx.stroke();

  /* gold tick markers: ENTRY / LOW / EXIT */
  function tickMark(xm, name){
    const px = X(xm);
    if (px < 4 || px > IW - 4) return;
    ictx.strokeStyle = GOLD; ictx.lineWidth = 1.5; ictx.globalAlpha = 0.9;
    ictx.beginPath(); ictx.moveTo(px, gy + 2); ictx.lineTo(px, gy + 9); ictx.stroke();
    ictx.globalAlpha = 1;
    iLabel(name, px, gy + 16, '#eec07a', 9);
  }
  function iLabel(txt, x, y, col, size, align){
    ictx.save();
    if (state.inspect) size = size * 1.6;
    ictx.font = '700 ' + size + 'px "Geist",sans-serif';
    ictx.textAlign = align || 'center'; ictx.textBaseline = 'middle';
    ictx.strokeStyle = 'rgba(5,4,10,.9)'; ictx.lineWidth = 3; ictx.lineJoin = 'round';
    ictx.strokeText(txt, x, y);
    ictx.fillStyle = col; ictx.fillText(txt, x, y);
    ictx.restore();
  }
  if (t0g !== null){
    tickMark(arcWorldPoint(solved, -t0g).x, 'ENTRY');
    tickMark(arcWorldPoint(solved, t0g).x, 'EXIT');
  } else if (solved.hasTurfContact){
    /* AVVIK (U1/D3b + D84): informasjon, ikke feiltilstand — muted, ikke bad.
       Teed-regime uten kryssing er korrekt og taus (mockens driverregel). */
    iLabel('NO TURF CONTACT', IW / 2, gy + 14, CSS('--muted'), 9);
  }

  /* inspeksjonsmodus: stance-kontekst — gull-basislinje + BACK/MID/FWD */
  if (state.inspect){
    const stanceC = -state.low / 100;
    const selBall = state.sel === 'low';
    const aB2 = selBall ? 0.55 : 0.30;
    const xs0 = X(stanceC - 0.20), xs1 = X(stanceC + 0.20);
    const nx = X(stanceC + LP_STANCE / 100);
    ictx.save(); ictx.globalAlpha = aB2;
    ictx.strokeStyle = tint('--strike', 0.9); ictx.lineWidth = 1.5;
    ictx.beginPath(); ictx.moveTo(Math.max(4, xs0), gy + 30); ictx.lineTo(Math.min(IW - 4, xs1), gy + 30); ictx.stroke();
    if (nx > 4 && nx < IW - 4){
      ictx.lineWidth = 2.5;
      ictx.beginPath(); ictx.moveTo(nx, gy + 24); ictx.lineTo(nx, gy + 36); ictx.stroke();
    }
    ictx.restore();
    for (const t2 of [[-0.11,'BACK'], [0,'MID'], [0.11,'FWD']]){
      const tx = X(stanceC + t2[0]);
      if (tx < 24 || tx > IW - 24) continue;
      ictx.save(); ictx.globalAlpha = 0.75;
      ictx.strokeStyle = CSS('--muted'); ictx.lineWidth = 1.5;
      ictx.beginPath(); ictx.moveTo(tx, gy + 26); ictx.lineTo(tx, gy + 34); ictx.stroke();
      ictx.restore();
      iLabel(t2[1], tx, gy + 47, CSS('--muted'), 9);
    }
  }
  /* low point keeps the attack-pink semantic (parameterpaletten, v3) */
  {
    const px = X(lpx), py = Y(solved.lowPointZ);
    if (px > 16 && px < IW - 16){
      ictx.beginPath(); ictx.arc(px, py, 3.2, 0, Math.PI * 2);
      ictx.fillStyle = LOW; ictx.fill();
      if (t0g !== null && Math.abs(px - X(arcWorldPoint(solved, -t0g).x)) > 30)
        iLabel('LOW', px, gy + 16, LOW, 9);
    }
  }
}

/* ---------- helpers ---------- */
function heroAlpha(key){                    // selected-input spotlight
  return state.sel === key ? 1 : 0.4;
}
function label(txt, x, y, color, size, align, mono, alpha){
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.font = (mono ? '700 ' : '600 ') + size + 'px ' + (mono
    ? '"IBM Plex Mono",monospace'
    : '"Geist",sans-serif');
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(5,4,10,.85)'; ctx.lineWidth = 3;   // dark halo, not glow
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
  ctx.restore();
}
/* transient-callout: stor, tabulær etikett på mørk plate med fargekant */
function plateLabel(txt, x, y, hue, size, align, alpha){
  ctx.save();
  const a = alpha == null ? 1 : alpha;
  ctx.font = '700 ' + size + 'px "IBM Plex Mono",monospace';
  const w = ctx.measureText(txt).width;
  const padX = size * 0.55, h = size * 1.75;
  let lx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  const rail = document.querySelector('.rail');
  if (rail){
    const stageRect = cv.getBoundingClientRect(), railRect = rail.getBoundingClientRect();
    const railTop = railRect.top - stageRect.top, railBottom = railRect.bottom - stageRect.top;
    const overlapsRailY = y + h / 2 > railTop - 4 && y - h / 2 < railBottom + 4;
    if (getComputedStyle(rail).flexDirection === 'row' || overlapsRailY){
      const rightLimit = railRect.left - stageRect.left - 6;
      lx = Math.min(lx, rightLimit - w - padX);
    }
  }
  lx = Math.max(6 + padX, lx);
  ctx.globalAlpha = a * 0.86;
  ctx.beginPath();
  ctx.roundRect(lx - padX, y - h / 2, w + padX * 2, h, h / 2 - 2);
  ctx.fillStyle = 'rgba(8,5,14,.9)'; ctx.fill();
  ctx.globalAlpha = a * 0.6; ctx.strokeStyle = hue; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.globalAlpha = a;
  ctx.fillStyle = hue; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, lx, y + 0.5);
  ctx.restore();
  return { left:lx - padX, top:y - h / 2, right:lx + w + padX, bottom:y + h / 2 };
}
function lowPointMarker(x, y, hue, view, ground, tangent){
  /* Måleinstrument, ikke badge (mockens tegning, bloom tilbake per D88).
     D88-vaktregelen: den opake kjernen ER punktet — bloomen ligger under. */
  const tLen = Math.hypot(tangent?.x || 0, tangent?.y || 0) || 1;
  const tx = (tangent?.x || 1) / tLen, ty = (tangent?.y || 0) / tLen;
  const gdx = (ground?.x ?? x) - x, gdy = (ground?.y ?? y) - y;
  const gLen = Math.hypot(gdx, gdy);
  const gx = gLen > 0.01 ? gdx / gLen : -ty;
  const gyv = gLen > 0.01 ? gdy / gLen : tx;
  const age = performance.now() - vecFlashAt;
  const pulse = !REDUCED && age >= 0 && age < 280 ? 1 - age / 280 : 0;

  ctx.save();
  ctx.lineCap = 'round';

  /* Exact elevation/depth relationship: pin to the projected turf datum. */
  if (ground && gLen > 0.75){
    const inset = Math.min(5.5, gLen * 0.35);
    ctx.globalAlpha = 0.42;
    ctx.strokeStyle = hue; ctx.lineWidth = 0.8;
    ctx.setLineDash([1.5, 2.5]);
    ctx.beginPath();
    ctx.moveTo(x + gx * inset, y + gyv * inset);
    ctx.lineTo(ground.x, ground.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.62;
    ctx.beginPath();
    ctx.moveTo(ground.x - tx * 3.5, ground.y - ty * 3.5);
    ctx.lineTo(ground.x + tx * 3.5, ground.y + ty * 3.5);
    ctx.stroke();
  }

  ctx.translate(x, y);
  ctx.transform(tx, ty, -ty, tx, 0, 0);

  /* Soft lens bloom stays subordinate to the white swing arc (D88). */
  const halo = ctx.createRadialGradient(0, 0, 1, 0, 0, 13);
  halo.addColorStop(0, 'rgba(255,255,255,.08)');
  halo.addColorStop(0.26, hue);
  halo.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* Open opposing apertures align the point to the local arc. */
  ctx.strokeStyle = hue; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.72;
  ctx.beginPath();
  ctx.ellipse(0, 0, 8.5, 5.5, 0, -Math.PI * 0.28, Math.PI * 0.28);
  ctx.ellipse(0, 0, 8.5, 5.5, 0, Math.PI * 0.72, Math.PI * 1.28);
  ctx.stroke();
  ctx.globalAlpha = 0.58;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-13, 0); ctx.lineTo(-8, 0);
  ctx.moveTo(8, 0); ctx.lineTo(13, 0);
  ctx.stroke();

  /* One short response to a model update. */
  if (pulse > 0){
    const p = 1 - pulse;
    ctx.globalAlpha = pulse * 0.24;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10 + p * 7, 6.5 + p * 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  /* The 3 px solid core is the sole exact point and remains fully opaque. */
  ctx.globalAlpha = 1;
  ctx.fillStyle = hue;
  ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.72)'; ctx.lineWidth = 0.65; ctx.stroke();
  ctx.restore();

  $('stage').dataset.lowPointMarker = [view, x.toFixed(1), y.toFixed(1), '1'].join(',');
  $('stage').dataset.lowPointInstrument = [view, gLen.toFixed(1), 'aperture-survey'].join(',');
}
function arrowHead(x, y, ux, uy, size, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(x, y); ctx.transform(ux, uy, -uy, ux, 0, 0);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(-size, size * 0.55); ctx.lineTo(-size, -size * 0.55);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
function coreLine(x1, y1, x2, y2, color, width, dash, alpha){
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

/* ============================================================ FACE ON
 * Impact-centred reframe with HYBRID vertical gain (eierens mock-beslutning). */
const PED_K = 1.7, PED_Z0 = 0.055;
const pedF  = z => PED_K * z - (PED_K - 1) * PED_Z0 * Math.tanh(z / PED_Z0);
const pedKz = z => PED_K - (PED_K - 1) / Math.cosh(z / PED_Z0) ** 2;
function faceMap(){
  const winM = W >= 700 ? 0.90 : 0.82;
  const scale = W / winM;
  const bx = W * 0.57, gy = H * 0.71;
  return { scale, bx, gy, K: PED_K, Kz: pedKz,
    X: xm => bx + xm * scale,
    Y: zm => gy - pedF(zm) * scale };
}
function drawFace(t){
  const M = faceMap();
  const t0g = solved.groundCrossingTheta0;
  const thImp = solved.thetaAtImpact;
  const lpx = solved.effectiveLowPointX;
  const BALL_R = solved.ballRadiusM;
  const sweetM = solved.sweetSpotHeightMm / 1000;
  const clubZ = solved.clubHeightM;
  const ballR = BALL_R * M.scale;
  /* Parameterpaletten (v3): attack-rosa lavpunkt/attack-transient,
     depth-orkidé arc-brakett, plane-periwinkle glass, strike-gull mål. */
  const A = { attack: CSS('--attack'), depth: CSS('--depth'), ink: CSS('--ink'),
              muted: CSS('--muted'), ghost: CSS('--ghost') };
  const fa = flashAlpha();

  ctx.save();
  ctx.clip(sceneClipPath(), 'evenodd');       // never draw under the mini screen

  /* --- ground: green grass layer on top, soil underneath --- */
  const gy = M.gy;
  {
    if (ready('turf')){
      ctx.drawImage(IMG.turf, 0, 0, IMG.turf.naturalWidth, IMG.turf.naturalHeight,
                    0, gy - 2, W, (H - gy) + 2);
      ctx.fillStyle = 'rgba(7,6,12,.4)';       // seat it in the dusk scene
      ctx.fillRect(0, gy - 2, W, (H - gy) + 2);
    }
    const soil = ctx.createLinearGradient(0, gy, 0, H);
    soil.addColorStop(0, 'rgba(61,43,26,' + (ready('turf') ? 0.25 : 1) + ')');
    soil.addColorStop(0.5, 'rgba(42,29,18,' + (ready('turf') ? 0.25 : 1) + ')');
    soil.addColorStop(1, 'rgba(26,18,12,' + (ready('turf') ? 0.3 : 1) + ')');
    ctx.fillStyle = soil; ctx.fillRect(0, gy, W, H - gy);
    const grass = ctx.createLinearGradient(0, gy, 0, gy + 8);
    grass.addColorStop(0, '#3f6b2e'); grass.addColorStop(1, '#2a4a22');
    ctx.fillStyle = grass; ctx.fillRect(0, gy, W, 8);
    ctx.strokeStyle = 'rgba(200,225,150,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    ctx.strokeStyle = 'rgba(130,185,85,.7)'; ctx.lineWidth = 1.5;
    for (let x = 8; x < W; x += 15){
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + ((x % 30) ? 2 : -2), gy - 5); ctx.stroke();
    }
  }

  /* --- footprints: stance is fixed in the world, the ball fixed on screen --- */
  {
    const stanceC = -state.low / 100;
    const selBall = state.sel === 'low';
    const fAlpha = selBall ? 0.30 : 0.16;
    for (const off of [-0.20, 0.20]){
      const fx = M.X(stanceC + off);
      if (fx < -30 || fx > W + 30) continue;
      ctx.save(); ctx.globalAlpha = fAlpha;
      ctx.beginPath();
      ctx.ellipse(fx, gy + 4, 23, 7, 0, 0, Math.PI * 2);
      ctx.fillStyle = A.ghost; ctx.fill();
      ctx.restore();
    }
    /* svingens lavpunkt er FAST i stance: attack-rosa basislinje med hakk */
    {
      const aB = selBall ? 0.5 : 0.16;
      const x0a = M.X(stanceC - 0.20), x1a = M.X(stanceC + 0.20);
      const nx = M.X(stanceC + LP_STANCE / 100);
      ctx.save(); ctx.globalAlpha = aB;
      ctx.strokeStyle = A.attack; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x0a, gy + 9); ctx.lineTo(x1a, gy + 9); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(nx, gy + 5); ctx.lineTo(nx, gy + 13); ctx.stroke();
      ctx.restore();
    }
    if (selBall){
      for (const t2 of [[-0.11,'BACK'], [0,'MID'], [0.11,'FWD']]){
        const tx = M.X(stanceC + t2[0]);
        if (Math.abs(tx - M.X(lpx)) < 18) continue;
        coreLine(tx, gy + 12, tx, gy + 17, A.muted, 1.5, null, 0.75);
        label(t2[1], tx, gy + 26, A.muted, 9, 'center', false, 0.8);
      }
    }
  }

  /* --- glass (swing plane + direction) behind the arc: mockens periwinkle
     via --plane-tokenet. Fill only, no border. --- */
  {
    const heroP = state.sel === 'plane' || state.sel === 'dir';
    const pt2 = (a, b2) => {
      const p = planePoint(solved, a, b2);
      return { x: M.X(p.x), y: M.Y(p.z) };
    };
    const quad = [pt2(-0.95, -0.04), pt2(0.95, -0.04), pt2(0.95, 1.0), pt2(-0.95, 1.0)];
    ctx.save();
    const grad = ctx.createLinearGradient(0, 0, 0, gy);
    const aG = heroP ? 0.30 : 0.16;
    grad.addColorStop(0, tint('--plane', aG * 0.25));
    grad.addColorStop(0.7, tint('--plane', aG * 0.7));
    grad.addColorStop(1, tint('--plane', aG));
    ctx.beginPath();
    quad.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 1;
    for (const bf of [0.30, 0.65]){
      const b2 = -0.04 + bf * 1.04;
      const ra = pt2(-0.95, b2), rb = pt2(0.95, b2);
      ctx.strokeStyle = tint('--plane', heroP ? 0.16 : 0.10);
      ctx.beginPath(); ctx.moveTo(ra.x, ra.y); ctx.lineTo(rb.x, rb.y); ctx.stroke();
    }
    ctx.restore();
  }

  /* --- reference clubhead: at turf ENTRY when that happens before the ball --- */
  {
    const hk = HEAD_IMG[state.club];
    if (ready(hk)){
      const im = IMG[hk];
      const hPx = HEAD_MM[state.club] * (ballR / (BALL_R * 1000));
      const wPx = hPx * (im.naturalWidth / im.naturalHeight);
      const ghost = ghostClubAnchor();
      const yB = M.Y(ghost.point.z), xR = M.X(ghost.point.x) - ballR * 0.92;
      ctx.save(); ctx.globalAlpha = 0.45;
      ctx.translate(xR, yB); ctx.rotate(LEAN[state.club]);
      ctx.drawImage(im, -wPx, -hPx, wPx, hPx);
      ctx.restore();
    }
  }

  /* --- swing arc (mockens pass: glød + kjerne, D88). Hero når Arc Height
     er valgt: buen selv lyser. --- */
  const arcPts = faceOnArcPoints(solved, 120, SWEEP_RAD);
  if (state.sel === 'arc'){
    strokeArc(arcPts, M, tint('--plane', 0.14), 18);
    strokeArc(arcPts, M, 'rgba(255,255,255,.30)', 6);
  }
  strokeArc(arcPts, M, 'rgba(255,255,255,.16)', 9);
  strokeArc(arcPts, M, 'rgba(255,255,255,.92)', 3);

  /* --- ball (live object → ember-comet glow); tee-lie: ball on a tee --- */
  const bx = M.bx, by = M.Y(ballLift()) - ballR;
  const isTee = state.lie === 'tee' || state.lie === 'teeHigh';
  if (ballLift() > 0){
    const tTop = by + ballR * 0.9, tH = gy - tTop;
    if (isTee && ready('tee') && tH > 6){
      const tW = tH * (IMG.tee.naturalWidth / IMG.tee.naturalHeight);
      ctx.drawImage(IMG.tee, bx - tW / 2, tTop, tW, tH);
    } else if (isTee){
      ctx.save();
      ctx.strokeStyle = 'rgba(210,205,225,.65)'; ctx.lineCap = 'round';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(bx, gy); ctx.lineTo(bx, by + ballR * 0.9); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx - 5, by + ballR * 0.92); ctx.lineTo(bx + 5, by + ballR * 0.92); ctx.stroke();
      ctx.restore();
    } else {
      /* AVVIK (D66/D93): gress-lie — strå bærer ballen */
      ctx.save();
      ctx.strokeStyle = 'rgba(130,185,85,.8)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      for (const o of [-6, -2, 3, 7]){
        ctx.beginPath(); ctx.moveTo(bx + o, gy);
        ctx.lineTo(bx + o * 0.6, by + ballR * 0.8); ctx.stroke();
      }
      ctx.restore();
    }
  }
  {
    /* hvile-halo + hero-forsterkning (mock, D88) */
    const heroBall = state.sel === 'low';
    const gr = ballR * (heroBall ? 2.8 : 2.1);
    const halo = ctx.createRadialGradient(bx, by, ballR * 0.4, bx, by, gr);
    halo.addColorStop(0, tint('--strike', heroBall ? 0.5 : 0.34));
    halo.addColorStop(0.5, tint('--primary', heroBall ? 0.28 : 0.16));
    halo.addColorStop(1, tint('--primary', 0));
    ctx.beginPath(); ctx.arc(bx, by, gr, 0, Math.PI * 2);
    ctx.fillStyle = halo; ctx.fill();
  }
  if (ready('ball')){
    ctx.drawImage(IMG.ball, bx - ballR - 2, by - ballR - 2, (ballR + 2) * 2, (ballR + 2) * 2);
  } else {
    const grad = ctx.createRadialGradient(bx - ballR*0.35, by - ballR*0.4, ballR*0.15, bx, by, ballR);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.75, '#efe9f2'); grad.addColorStop(1, '#c8bfd2');
    ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = 'rgba(255,175,120,.4)'; ctx.lineWidth = 1; ctx.stroke();
  }

  /* kontakt-blush på hovedballen + ankerpunkt for glinten */
  let contactPt = null;
  {
    const fa2 = flashAlpha();
    const dyC = clamp(((clubZ + sweetM) - (ballLift() + BALL_R)) * (ballR / BALL_R),
                      -ballR * 0.85, ballR * 0.85);
    const cyB = by - dyC;
    const cxB = bx - Math.sqrt(Math.max(0, ballR * ballR - dyC * dyC)) * 0.9;
    contactPt = { x: cxB, y: cyB };
    const rB = ballR * 0.55;
    const gB = ctx.createRadialGradient(cxB, cyB, 0, cxB, cyB, rB);
    const aB = 0.26 + 0.42 * fa2;
    gB.addColorStop(0, 'rgba(255,196,120,' + aB.toFixed(3) + ')');
    gB.addColorStop(0.45, tint('--primary', +(aB * 0.55).toFixed(3)));
    gB.addColorStop(1, tint('--primary', 0));
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = gB;
    ctx.beginPath(); ctx.arc(cxB, cyB, rB, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* strike-location reference on the ghosted face */
  if (ready(HEAD_IMG[state.club])){
    const fx2 = M.bx - ballR * 0.92;
    const yCt = by;
    const ySw = by - ((clubZ + sweetM) - (ballLift() + BALL_R)) * (ballR / BALL_R);
    ctx.save();
    ctx.strokeStyle = 'rgba(245,242,255,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(fx2 - 7, ySw); ctx.lineTo(fx2 + 1, ySw); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx2, yCt, 3, 0, Math.PI * 2);
    ctx.fillStyle = tint('--primary', 0.95); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  /* --- underground gold: the arc segment below ground (entry→low→exit),
     strike-gull, fades with the flash (mock, D88) --- */
  if (t0g !== null && fa > 0.01){
    ctx.save(); ctx.lineCap = 'round';
    const seg = arcWorldPoints(solved, 30, t0g);
    const ex0 = M.X(seg[0].x), ex1 = M.X(seg[seg.length - 1].x);
    const segDraw = pass => {
      ctx.beginPath();
      seg.forEach((p, i) => i ? ctx.lineTo(M.X(p.x), M.Y(p.z)) : ctx.moveTo(M.X(p.x), M.Y(p.z)));
      ctx.lineWidth = pass; ctx.stroke();
    };
    ctx.globalAlpha = 0.20 * fa;
    ctx.strokeStyle = tint('--primary', 1); segDraw(8);
    ctx.globalAlpha = fa;
    const gGold = ctx.createLinearGradient(ex0, 0, ex1, 0);
    gGold.addColorStop(0, '#fdf3e0'); gGold.addColorStop(0.55, CSS('--strike')); gGold.addColorStop(1, CSS('--primary'));
    ctx.strokeStyle = gGold; segDraw(2.6);
    ctx.restore();
  }

  /* --- CLUB ATTACK: springs OUT of the arc exactly at the strike point --- */
  if (fa > 0.01){
    const segPts = [];
    for (let i = 0; i <= 16; i++){
      const th = thImp - 0.16 + (0.16 * i) / 16;
      const p = arcWorldPoint(solved, th);
      segPts.push({ x: M.X(p.x), y: M.Y(p.z) });
    }
    const impactIdx = segPts.length - 1;
    const tv = tangentWorld(solved, thImp);
    const zK = tv.z * M.Kz(clubZ);   // lokal gain ved kontakt: sann retning ved ballen
    const len2 = Math.hypot(tv.x, zK) || 1;
    const dx = tv.x / len2, dz = zK / len2;
    const p0 = segPts[segPts.length - 1];
    const Lout = W >= 700 ? 104 : 78;
    for (let i = 1; i <= 10; i++){
      const d = (Lout * i) / 10;
      segPts.push({ x: p0.x + dx * d, y: p0.y - dz * d });
    }
    litSegment(segPts, A.attack, fa, impactIdx);
    if (ready('glint') && !REDUCED && contactPt){   // impact glint (mock, D88)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.85 * fa;
      ctx.drawImage(IMG.glint, contactPt.x - 27, contactPt.y - 27, 54, 54);
      ctx.restore();
    }
  }

  /* --- hero: arc height (vertical bracket ground ↔ arc bottom) --- */
  if (state.sel === 'arc'){
    const x = Math.min(M.X(lpx), bx) - 52;
    const yA = gy, yB = M.Y(solved.lowPointZ);
    coreLine(x, yA, x, yB, A.depth, 2.5, null, 1);
    coreLine(x - 6, yA, x + 6, yA, A.depth, 2, null, 1);
    coreLine(x - 6, yB, x + 6, yB, A.depth, 2, null, 1);
    if (Math.abs(yB - yA) > 8)
      arrowHead(x, yB, 0, yB < yA ? -1 : 1, 7, A.depth, 1);
    /* AVVIK (D67, arvet): «ARC 2.0 cm above», aldri nakent fortegn */
    label('ARC ' + formatHeightCm(state.arc), x - 10,
          Math.abs(yB - yA) > 16 ? (yA + yB) / 2 : yA - 18, A.depth, 11, 'right', true);
  }

  /* Permanent physical low point, above every transient teaching vector. */
  {
    const before = arcWorldPoint(solved, -0.015), after = arcWorldPoint(solved, 0.015);
    const lp = { x:M.X(lpx), y:M.Y(solved.lowPointZ) };
    const ground = { x:lp.x, y:gy };
    const tangent = { x:M.X(after.x) - M.X(before.x),
                      y:M.Y(after.z) - M.Y(before.z) };
    lowPointMarker(lp.x, lp.y, A.attack, 'face', ground, tangent);
  }

  ctx.restore();                              // close the inset punch-out clip
}
function strokeArc(pts2, M, style, width){
  ctx.save();
  ctx.strokeStyle = style; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath();
  pts2.forEach(([xm, zm], i) => {
    const x = M.X(xm), y = M.Y(zm);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}

/* ============================================================ DOWN THE LINE */
function dtlCamSpec(){
  const tallStage = W / Math.max(H, 1) < 2;
  return { pos:{ x:-2.2, y:-0.9, z:1.0 }, look:{ x:2.3, y:0.25, z:0.14 },
           fovDeg: tallStage ? 44 : (H < 240 ? 37 : 34),
           xStretch:tallStage ? 0.92 : 1.02,
           screenX:W * (tallStage ? 0.05 : 0.075) };
}
const DTL_SWEEP = (78 * Math.PI) / 180;       // longer arc into the perspective
function drawDtl(t){
  const B = pinholeCamera(dtlCamSpec(), W, H);
  const P = p => projectPoint(p, B);
  const A = { path: CSS('--path'), attack: CSS('--attack'), sec: CSS('--secondary'),
              depth: CSS('--depth'), ink: CSS('--ink'), muted: CSS('--muted') };
  const fa = flashAlpha();

  ctx.save();
  ctx.clip(sceneClipPath(), 'evenodd');       // never draw under the mini screen

  /* ground plane wash + subtle grid */
  const horizon = P({ x: 60, y: 0, z: 0 });
  if (horizon){
    const gGrad = ctx.createLinearGradient(0, horizon.y, 0, H);
    gGrad.addColorStop(0, 'rgba(46,74,34,.0)');
    gGrad.addColorStop(0.25, 'rgba(46,74,34,.4)');
    gGrad.addColorStop(1, 'rgba(30,50,24,.6)');
    ctx.fillStyle = gGrad; ctx.fillRect(0, horizon.y, W, H - horizon.y);
  }
  ctx.save(); ctx.globalAlpha = 0.5;
  for (const off of [-1.5, -0.75, 0.75, 1.5]){
    const a = P({ x: -0.5, y: off, z: 0 }), b = P({ x: 40, y: off, z: 0 });
    if (a && b) coreLine(a.x, a.y, b.x, b.y, 'rgba(255,255,255,.07)', 1);
  }
  for (let xm = 1; xm <= 9; xm += 2){
    const a = P({ x: xm, y: -1.8, z: 0 }), b = P({ x: xm, y: 1.8, z: 0 });
    if (a && b) coreLine(a.x, a.y, b.x, b.y, 'rgba(255,255,255,.05)', 1);
  }
  ctx.restore();

  /* target line: neutral solid reference to the vanishing point */
  {
    const a = P({ x: -0.6, y: 0, z: 0 }), b = P({ x: 45, y: 0, z: 0 });
    if (a && b){
      coreLine(a.x, a.y, b.x, b.y, 'rgba(245,242,255,.5)', 2, null, 1);
      label('TARGET', b.x, b.y - 12, 'rgba(245,242,255,.75)', 11, 'center');
    }
  }

  /* Swing Direction ground reference (secondary, mockens rolle).
     Retningsvektor fra adapterens directionRay (D63). */
  {
    const ray = directionRay(state.dir);      // [sin, cos]
    const v = { x: ray[1], y: ray[0] };
    const a = P({ x:-0.25*v.x, y:-0.25*v.y, z:0.008 });
    const b = P({ x:11*v.x, y:11*v.y, z:0.008 });
    if (a && b){
      const hero = state.sel === 'dir';
      coreLine(a.x, a.y, b.x, b.y, A.sec, hero ? 2.8 : 1.35, [7,6], hero ? 0.9 : 0.35);
      const dxl = b.x - a.x, dyl = b.y - a.y, ll = Math.hypot(dxl, dyl) || 1;
      arrowHead(b.x, b.y, dxl / ll, dyl / ll, hero ? 8 : 6, A.sec, hero ? 0.9 : 0.42);
      if (hero){
        const m = P({ x:6.4*v.x, y:6.4*v.y, z:0.008 });
        if (m) plateLabel('SWING DIRECTION ' + formatAngle(state.dir, { signed:true }),
          clamp(m.x + 14, 12, W - 280), clamp(m.y - 20, 20, H - 20), A.sec,
          W >= 700 ? 15 : 13, 'left', 1);
      }
    }
  }

  /* soft contact shadow under the arc's low region — anchors it to the ground */
  {
    const lpw = solved.lowPointWorld;
    const c = P({ x: lpw.x, y: lpw.y, z: 0 });
    const e1 = P({ x: lpw.x - 0.45, y: lpw.y, z: 0 });
    const e2 = P({ x: lpw.x + 0.45, y: lpw.y, z: 0 });
    if (c && e1 && e2){
      const rx = Math.hypot(e2.x - e1.x, e2.y - e1.y) / 2;
      const zLift = Math.max(0, solved.lowPointZ);
      const aS = clamp(0.38 - zLift * 7, 0.08, 0.38);
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, rx);
      g.addColorStop(0, 'rgba(5,3,10,' + aS + ')');
      g.addColorStop(1, 'rgba(5,3,10,0)');
      ctx.save();
      ctx.translate(c.x, c.y); ctx.scale(1, 0.28); ctx.translate(-c.x, -c.y);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, rx, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  /* swing-plane glass: one job, showing plane. Density gradient + rim light —
     no outline. (mockens tegning; glasset består, eierlåst i D76-runden) */
  {
    const heroG = state.sel === 'plane';
    const alpha = heroG ? 1 : 0.45;
    const a0 = -1.25, a1 = 3.2, b0 = -0.04, b1 = 1.15;
    const poly = [planePoint(solved, a0, b0), planePoint(solved, a1, b0),
                  planePoint(solved, a1, b1), planePoint(solved, a0, b1)].map(P);
    if (poly.every(Boolean)){
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.beginPath();
      poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      const mb = { x: (poly[0].x + poly[1].x) / 2, y: (poly[0].y + poly[1].y) / 2 };
      const mt = { x: (poly[3].x + poly[2].x) / 2, y: (poly[3].y + poly[2].y) / 2 };
      const base = heroG ? 0.26 : 0.11;
      const gg = ctx.createLinearGradient(mb.x, mb.y, mt.x, mt.y);
      gg.addColorStop(0, tint('--plane', base));
      gg.addColorStop(0.55, tint('--plane', +(base * 0.55).toFixed(3)));
      gg.addColorStop(1, tint('--secondary', +(base * 0.28).toFixed(3)));
      ctx.fillStyle = gg;
      ctx.fill();
      ctx.lineWidth = 1;
      for (const bf of [0.30, 0.65]){
        const b2 = b0 + bf * (b1 - b0);
        const ra = P(planePoint(solved, a0, b2)), rb = P(planePoint(solved, a1, b2));
        if (ra && rb){
          ctx.strokeStyle = tint('--plane', heroG ? 0.11 : 0.07);
          ctx.beginPath(); ctx.moveTo(ra.x, ra.y); ctx.lineTo(rb.x, rb.y); ctx.stroke();
        }
      }
      /* rim light along the upper edge sells the pane as glass */
      ctx.strokeStyle = 'rgba(190,200,255,' + (heroG ? 0.5 : 0.22) + ')';
      ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(poly[3].x, poly[3].y); ctx.lineTo(poly[2].x, poly[2].y); ctx.stroke();
      ctx.restore();
    }
  }

  /* swing arc: depth-tapered ribbon (mockens fire pass, D88). */
  {
    const worldPts = arcWorldPoints(solved, 150, DTL_SWEEP);
    const pts = [];
    for (let i = 0; i < worldPts.length; i++){
      const p = P(worldPts[i]);
      if (p) pts.push({ x: p.x, y: p.y, d: p.d, u: i / (worldPts.length - 1) });
    }
    if (pts.length > 8){
      let dMin = Infinity, dMax = -Infinity;
      for (const p of pts){ if (p.d < dMin) dMin = p.d; if (p.d > dMax) dMax = p.d; }
      const span = Math.max(0.001, dMax - dMin);
      const tOf = p => (p.d - dMin) / span;
      const tip = uu => clamp(Math.min(uu, 1 - uu) / 0.12, 0, 1);
      const litA = state.sel === 'arc' ? 1 : fa;
      const CH = 16;
      ctx.save(); ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
      const passes = [];                       /* [wNear,wFar,aNear,aFar,color,gate] */
      if (litA > 0.01) passes.push([24, 8, 0.13, 0.03, tint('--plane', 1), litA]);
      passes.push([11, 3.5, 0.15, 0.05, 'rgba(255,255,255,1)', 1]);
      if (litA > 0.01) passes.push([7, 2.2, 0.32, 0.09, 'rgba(255,255,255,1)', litA]);
      passes.push([4.2, 1.2, 0.95, 0.30, 'rgba(255,255,255,1)', 1]);
      for (const [wN, wF, aN, aF, col, gate] of passes){
        ctx.strokeStyle = col;
        const per = Math.ceil((pts.length - 1) / CH);
        for (let c0 = 0; c0 < pts.length - 1; c0 += per){
          const c1 = Math.min(c0 + per, pts.length - 1);
          const mid = pts[Math.floor((c0 + c1) / 2)];
          const tt = tOf(mid);
          ctx.globalAlpha = gate * (aN + (aF - aN) * tt) * tip(mid.u);
          ctx.lineWidth = wN + (wF - wN) * tt;
          ctx.beginPath();
          for (let i = c0; i <= c1; i++) i === c0 ? ctx.moveTo(pts[i].x, pts[i].y) : ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  /* arc-height bracket (hero when arc selected) */
  if (state.sel === 'arc'){
    const g = P({ x: solved.effectiveLowPointX, y: 0, z: 0 });
    const l = P(arcWorldPoint(solved, 0));
    if (g && l && Math.abs(l.y - g.y) > 2){
      coreLine(g.x - 26, g.y, l.x - 26, l.y, A.depth, 2.5);
      coreLine(g.x - 32, g.y, g.x - 20, g.y, A.depth, 2);
      coreLine(l.x - 32, l.y, l.x - 20, l.y, A.depth, 2);
      label('ARC ' + formatHeightCm(state.arc), g.x - 38, (g.y + l.y) / 2,
            A.depth, 11, 'right', true);
    } else if (g){
      label('ARC ' + formatHeightCm(state.arc), g.x - 38, g.y - 14, A.depth, 11, 'right', true);
    }
  }

  /* ball (tee-lie: on the tee; gress-lie: strå) */
  {
    const lift = ballLift();
    const b = P({ x: 0, y: 0, z: lift + solved.ballRadiusM });
    const gnd = P({ x: 0, y: 0, z: 0 });
    const bb = P({ x: 0, y: 0, z: lift });
    if (b && gnd && bb){
      if (lift > 0){
        const isTee = state.lie === 'tee' || state.lie === 'teeHigh';
        coreLine(gnd.x, gnd.y, bb.x, bb.y,
                 isTee ? 'rgba(210,205,225,.6)' : 'rgba(130,185,85,.7)', 2.5);
      }
      const r = Math.max(6, (gnd.y - b.y) * 0.55);
      if (state.sel === 'low'){                // ball hero: ember glow (mock)
        const gr = r * 3;
        const halo = ctx.createRadialGradient(b.x, b.y, r * 0.4, b.x, b.y, gr);
        halo.addColorStop(0, tint('--strike', 0.4));
        halo.addColorStop(0.5, tint('--primary', 0.2));
        halo.addColorStop(1, tint('--primary', 0));
        ctx.beginPath(); ctx.arc(b.x, b.y, gr, 0, Math.PI * 2);
        ctx.fillStyle = halo; ctx.fill();
      }
      const grad = ctx.createRadialGradient(b.x - r*0.3, b.y - r*0.35, r*0.15, b.x, b.y, r);
      grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#b9b2c4');
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad; ctx.fill();
    }
  }

  /* underground gold: same θ-segment as Face On, no text, fades out */
  {
    const t0g = solved.groundCrossingTheta0;
    if (t0g !== null && fa > 0.01){
      ctx.save(); ctx.lineCap = 'round';
      const seg = arcWorldPoints(solved, 30, t0g).map(P).filter(Boolean);
      if (seg.length > 1){
        const segDraw = wpx => {
          ctx.beginPath();
          seg.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
          ctx.lineWidth = wpx; ctx.stroke();
        };
        ctx.globalAlpha = 0.20 * fa;
        ctx.strokeStyle = tint('--primary', 1); segDraw(8);
        ctx.globalAlpha = fa;
        const gGold = ctx.createLinearGradient(seg[0].x, seg[0].y,
          seg[seg.length - 1].x, seg[seg.length - 1].y);
        gGold.addColorStop(0, '#fdf3e0'); gGold.addColorStop(0.55, CSS('--strike')); gGold.addColorStop(1, CSS('--primary'));
        ctx.strokeStyle = gGold; segDraw(2.6);
      }
      ctx.restore();
    }
  }

  /* CLUB PATH: springs OUT of the arc at the strike point */
  if (fa > 0.01){
    const thImp = solved.thetaAtImpact;
    const segPts = [];
    for (let i = 0; i <= 16; i++){
      const th = thImp - 0.16 + (0.16 * i) / 16;
      const p = P(arcWorldPoint(solved, th));
      if (p) segPts.push(p);
    }
    const impactIdx = segPts.length - 1;
    const tv = tangentWorld(solved, thImp);
    const n = Math.hypot(tv.x, tv.y, tv.z) || 1;
    const dir3 = { x: tv.x / n, y: tv.y / n, z: tv.z / n };
    const imp3 = arcWorldPoint(solved, thImp);
    for (let i = 1; i <= 10; i++){
      const d = (0.9 * i) / 10;
      const p = P({ x: imp3.x + dir3.x * d, y: imp3.y + dir3.y * d, z: imp3.z + dir3.z * d });
      if (p) segPts.push(p);
    }
    litSegment(segPts, A.path, fa, impactIdx);
    const impP = P(arcWorldPoint(solved, thImp));
    if (impP && ready('glint') && !REDUCED){   // impact glint, additive (mock, D88)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.8 * fa;
      ctx.drawImage(IMG.glint, impP.x - 24, impP.y - 24, 48, 48);
      ctx.restore();
    }
  }

  /* Draw last so neither Club Path nor another transient can cover it. */
  {
    const lowWorld = arcWorldPoint(solved, 0);
    const lp = P(lowWorld);
    const ground = P({ x:lowWorld.x, y:lowWorld.y, z:0 });
    const before = P(arcWorldPoint(solved, -0.015)), after = P(arcWorldPoint(solved, 0.015));
    if (lp) lowPointMarker(lp.x, lp.y, A.attack, 'dtl', ground,
      before && after ? { x:after.x - before.x, y:after.y - before.y } : { x:1, y:0 });
  }

  ctx.restore();                              // close the inset punch-out clip
}

/* ============================================================ orientation-vakt
 * Fra eierens sa-app-shell.js (inert-håndteringen), uten IAP/analytics
 * (eierstrippet). D59: betingelsen er orientering + minimum. */
function installOrientationGuard(){
  const overlay = document.querySelector('.rotate');
  if (!overlay || !window.matchMedia) return;
  const media = matchMedia('(orientation: landscape) and (min-width: 568px) and (min-height: 320px)');
  const managed = new Map();
  let lastFocus = null;
  const sync = () => {
    const blocked = !media.matches;
    overlay.toggleAttribute('data-sa-orientation-blocked', blocked);
    if (blocked){
      lastFocus = document.activeElement;
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('tabindex', '0');
      for (const child of document.body.children){
        if (child === overlay || child.tagName === 'SCRIPT') continue;
        if (!managed.has(child)) managed.set(child, child.hasAttribute('inert'));
        child.setAttribute('inert', '');
      }
      requestAnimationFrame(() => overlay.focus({ preventScroll: true }));
      return;
    }
    overlay.setAttribute('role', 'status');
    overlay.removeAttribute('aria-modal');
    overlay.removeAttribute('tabindex');
    for (const [child, wasInert] of managed){
      if (!wasInert) child.removeAttribute('inert');
    }
    managed.clear();
    if (lastFocus instanceof HTMLElement && lastFocus.isConnected){
      lastFocus.focus({ preventScroll: true });
    }
    lastFocus = null;
  };
  media.addEventListener?.('change', sync);
  /* WKWebView/innebygde webviews kan droppe change-eventet — remål på resize
     OG fra canvasens ResizeObserver (mockens egen WKWebView-advarsel). */
  addEventListener('resize', sync);
  sync();
  return sync;
}

/* ============================================================ boot */
syncOrientation = installOrientationGuard();
updateChipValues();
selectParam('low');
updateOutcomes();
prevOut = null; updateOutcomes();   // seed without pulsing
vecFlashAt = performance.now();     // one orientation flash on load, then fade
applyStageBg();
resize();

/* D56/D99 — navngitt inngrep fra strøm E. Onboardingens steg 4–5 kjører INNE i
   denne skjermen (aldri i en kopi), og trenger å skrive tilstanden, lese det
   løste svaret, og åpne strike-insetten (D3b krever underlaget synlig). Alt
   går gjennom skjermens EGNE funksjoner — ingen ny fysikk, ingen parallell
   tilstand, ingen ny tegnevei. */
const studioApi = {
  state,
  get solved() { return solved; },
  applyStudio(patch) {
    Object.assign(state, patch);
    if (patch.club) state.plane = patch.plane ?? PLANE_PRESET[patch.club];
    $('clubCap').textContent = CLUB_LABEL[state.club];
    computeSolved();
    updateChipValues();
    selectParam(state.sel);           // remåler slideren mot ny verdi
    updateOutcomes();
    kick();
  },
  selectParam,
  setInspect,
  reset() { $('resetBtn').click(); },
};
window.__studio = studioApi;

/* D56 — onboardingen monteres OPPÅ skjermen. Er den ikke i gang, skjer intet. */
Promise.all([
  import('../onboarding/onboarding.js'),
  import('../onboarding/host-studio.js'),
]).then(([ob, host]) => ob.mountOnboarding(host.studioHost(studioApi)));
</script>
