<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060C" />
<title>Flight Glass — Impact Studio</title>
<!--
  D82/v3: mockens visuelle språk ER fasit (_source/mocks/impact-studio/,
  skrivebeskyttet per D77 — dette er kopien). Strøm Bs jobb her er
  motorkobling via adapter/, U-rettelsene, arvereglene (tallformat,
  informasjonsnivåer, én leder, tilstander), fontbyttet Inter→Geist (D83)
  og gul-oppryddingen (D84/D89). Glød per D88: mockens materialglød står;
  vaktregelen er at ingen målt posisjon får bli tvetydig av den.
  Hvert avvik fra mocken er merket «AVVIK (ref)» — full liste i STUDIO.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../onboarding/onboarding.css" />
<style>
  /* ── Mock-varnavn → v3-tokens ─────────────────────────────────────────────
     Mockens egne variabelnavn beholdes i komposisjons-CSS-en under; verdiene
     kommer fra tokens.css (som ER mockens palett, D82). Lokale tillegg er
     mock-materiale uten token ennå — meldt som token-hull i STUDIO.md. */
  :root{
    --bg:var(--neutral);
    --muted-tk:var(--muted);
    --line-tk:var(--line);
    /* --line-strong og --dusk-scene-bg kommer nå fra tokens.css (tettet av
       orkestrator 2026-08-26); lokalkopiene er fjernet. */
    --card-line:var(--line);
    --secondary-line:color-mix(in srgb, var(--secondary) 45%, transparent);
    --secondary-soft:color-mix(in srgb, var(--secondary) 14%, transparent);
    --studio-soil:#8a5a2b;                 /* scene-materiale, ikke palett */
  }
  /* D94: fokusring i INK per mock-konvensjonen — backdrop-sikker dobbelring
     (mørk 1 px under 3 px ink, innfelt). Range-inputen har transparent flate,
     så den får en synlig ink-outline i stedet. */
  :focus-visible{outline:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.85), inset 0 0 0 3px var(--ink)}
  :focus:not(:focus-visible){outline:none}
  #range:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:none}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    /* height:100% (ikke dvh): dvh desynker i WKWebView etter bakgrunn/forgrunn */
    display:flex;flex-direction:column;height:100%;user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* ---------- outcome strip ---------- */
  .top{display:flex;gap:8px;align-items:stretch;padding:5px 10px;height:54px;flex:0 0 auto}
  .card{
    flex:1 1 0;min-width:0;border-radius:12px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;gap:10px;
    position:relative;border:1px solid var(--card-line);
    transition:opacity .25s var(--ease);
  }
  .card .col{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
  .card .lab{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
    letter-spacing:.07em;color:var(--muted-tk);white-space:nowrap}
  .card .lab .dot{width:6px;height:6px;border-radius:50%;background:var(--card-hue);flex:0 0 auto}
  .card .val{font-family:var(--font-data);font-variant-numeric:tabular-nums;
    font-size:18px;font-weight:700;color:var(--ink);line-height:1;white-space:nowrap}
  .card.attack{--card-hue:var(--attack);--card-line:color-mix(in srgb,var(--attack) 22%,transparent)}
  .card.path{--card-hue:var(--path);--card-line:color-mix(in srgb,var(--path) 22%,transparent)}
  .card::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;
    border-radius:2px;background:var(--card-hue);opacity:0;transition:opacity .3s var(--ease)}
  .card.hit::after{opacity:1}
  .card.dim{opacity:.55}
  /* AVVIK (N-a/N-b, låst navigasjon): pil-ikonet → HOME-ordsirkelen, 44 px.
     v3-komponenten home-circle: plate-grunn, ink-tekst, pill. */
  .ts-back{-webkit-tap-highlight-color:transparent;text-decoration:none;flex:0 0 44px;
    width:44px;height:44px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink);background:var(--plate);border:1px solid var(--line-tk);
    font-size:10px;font-weight:700;letter-spacing:.1em;
    transition:transform .15s,border-color .2s}
  .ts-back:active{transform:scale(.95);border-color:var(--line-strong)}
  /* AVVIK (DESIGN Ikonografi, arvet): ↺-glyf alene → ordet RESET */
  #resetBtn{
    flex:0 0 auto;min-width:44px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line-tk);color:var(--muted-tk);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
    font-size:10px;font-weight:700;letter-spacing:.1em;padding:0 10px;
  }
  #resetBtn:active{color:var(--ink);border-color:var(--line-strong)}

  /* ---------- stage ---------- */
  .stage{position:relative;flex:1 1 auto;min-height:0;margin:0 10px;border-radius:14px;
    overflow:hidden;border:1px solid var(--line-tk);
    background:var(--dusk-scene-bg)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* right rail: perspective, club, and the dedicated Strike contact view. */
  .rail{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .orb{
    width:58px;min-height:60px;padding:4px 2px 6px;border-radius:14px;cursor:pointer;
    background:var(--plate-glass);border:1px solid var(--line-tk);color:var(--muted-tk);
    font-family:inherit;backdrop-filter:blur(3px);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transition:transform .16s cubic-bezier(.16,1,.3,1),border-color .18s cubic-bezier(.16,1,.3,1);
  }
  .orb:active{border-color:var(--line-strong);transform:scale(.96)}
  .orb svg{width:40px;height:36px;display:block}
  .orb .cap{font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--ink)}
  .orb::before{content:"";position:absolute;inset:-3px;border-radius:17px;
    border:2px solid var(--secondary);opacity:0;transform:scale(.97);pointer-events:none;
    transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1)}
  .orb.pulse::before{opacity:.9;transform:scale(1.06)}
  .orb.contact-active{border-color:color-mix(in srgb,var(--strike) 62%,transparent)}
  .view-toast{position:absolute;top:10px;left:50%;z-index:7;transform:translate(-50%,-4px);
    min-height:36px;padding:9px 14px;border-radius:12px;background:var(--plate-glass);
    border:1px solid var(--secondary-line);
    box-shadow:0 14px 34px -18px color-mix(in srgb,var(--bg) 88%,transparent);
    color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.12em;white-space:nowrap;
    opacity:0;transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1);
    pointer-events:none}
  .view-toast.is-visible{opacity:1;transform:translate(-50%,0)}

  /* miniskjerm: zoomed contact-zone inset (mockens mønster) */
  .inset{
    position:absolute;top:8px;left:8px;z-index:4;
    width:min(32%,240px);border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,color-mix(in srgb,var(--plate) 96%,transparent),color-mix(in srgb,var(--bg) 96%,transparent));
    border:1px solid color-mix(in srgb,var(--strike) 30%,transparent);
    box-shadow:0 18px 50px -20px color-mix(in srgb,var(--bg) 85%,transparent),inset 0 0 0 1px var(--glass-edge);
    backdrop-filter:blur(3px);
  }
  /* Informasjonsnivåer (arvet): panelets SVAR er strike-resultatet (.st) i
     ink på data-nivå; paneltittel + kontekstrad er META — muted, aldri rop. */
  .inset .eyebrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 36px 1px 10px;font-size:10px;font-weight:700;letter-spacing:.14em;
    color:var(--muted-tk);white-space:nowrap;
  }
  .inset .eyebrow .st{font-family:var(--font-data);font-variant-numeric:tabular-nums;
    letter-spacing:0;color:var(--ink)}
  .inset .eyebrow .st em{font-style:normal;font-family:var(--font-ui);font-weight:800;
    letter-spacing:.08em}
  /* AVVIK (U1/D3b): kontekstraden — underlaget står ALLTID i samme visning som
     turfkontakt-statusen (D93: lie-NAVNET fast etikett, mm som caption);
     maksimert viser også loftantagelsen (D65). */
  .inset .eyebrow2{
    padding:0 36px 3px 10px;font-size:9px;font-weight:500;letter-spacing:.08em;
    color:var(--muted-tk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inset .eyebrow2 .mmv{font-family:var(--font-data);letter-spacing:0;font-weight:500}
  /* Proveniensmerker er små chips i meta-nivået (arvet) */
  .prov-chip{display:inline-block;border:1px solid var(--line-tk);border-radius:4px;
    padding:0 3px;margin-left:5px;font-size:8px;font-weight:700;letter-spacing:.08em;
    color:var(--muted-tk);vertical-align:1px}
  .inset--max .prov-chip{font-size:9px;padding:0 4px}
  .inset::after{content:"";position:absolute;left:10px;right:10px;top:24px;height:2px;
    border-radius:2px;background:var(--strike);opacity:0;transition:opacity .3s var(--ease)}
  .inset.hit::after{opacity:1}
  #insetCv{display:block;width:100%;height:100px}
  .inset .eyebrow > span:first-child{margin-right:8px}
  .inset .eyebrow .ez,.inset .eyebrow2 .ez{display:none}  /* compact → short always */
  @media (max-width:620px){ #insetCv{height:76px}
    .inset .eyebrow{font-size:10px;padding:5px 8px 1px}
    .inset .eyebrow2{padding:0 8px 2px} }
  /* maksimer: innsetet blir inspeksjonsmodus i full scene (lavpunkt + divot) */
  .inset__max{position:absolute;right:0;top:0;width:44px;height:44px;border:0;cursor:pointer;
    background:transparent;color:var(--strike);font-size:15px;line-height:1;opacity:.85;padding:0;z-index:6;
    font-family:inherit;transition:transform .16s cubic-bezier(.16,1,.3,1),opacity .16s cubic-bezier(.16,1,.3,1)}
  .inset__max:active{transform:scale(.92);opacity:1}
  .inset--max{top:8px;left:8px;right:8px;bottom:8px;width:auto;max-width:none;
    display:flex;flex-direction:column}
  .inset--max .inset__max{right:72px;top:2px;width:44px;height:44px;font-size:17px}
  .inset--max #insetCv{flex:1 1 auto;height:auto!important;min-height:0}
  .inset--max .eyebrow{font-size:13px;padding:10px 132px 2px 14px}
  .inset--max .eyebrow2{font-size:11px;padding:0 132px 4px 14px}
  .inset--max .eyebrow .ez,.inset--max .eyebrow2 .ez{display:inline}

  /* ---------- controls ---------- */
  .controls{flex:0 0 auto;height:calc(96px + env(safe-area-inset-bottom));
    padding:2px 10px calc(2px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
  .chips{display:flex;gap:8px;flex:0 0 44px}
  .chip{
    flex:1 1 0;min-width:0;border-radius:12px;background:var(--surface);cursor:pointer;
    border:1px solid var(--line-tk);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;font-family:inherit;color:var(--muted-tk);padding:0 4px;
  }
  .chip .cl{font-size:10.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis}
  /* Informasjonsnivåer (arvet): holdt parameter er INAKTIV — ghost og mindre;
     kun den aktive kontrollens verdi står på verdinivået. */
  .chip .cv{font-family:var(--font-data);font-variant-numeric:tabular-nums;
    font-size:11px;font-weight:500;color:var(--ghost);line-height:1;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .chip.active{border-color:var(--chip-hue);color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--chip-hue), 0 0 18px -8px var(--chip-hue)}
  .chip.active .cl{color:var(--chip-hue)}
  .chip.active .cv{font-size:14px;font-weight:700;color:var(--ink)}
  /* Parameterpaletten (v3): hver parameter eier sin kulør.
     D95: LIE har bevisst INGEN parameterkulør — underlag er kontekst;
     chip og slider står i ink/ghost, aldri secondary. */
  .chip[data-p="plane"]{--chip-hue:var(--plane)}
  .chip[data-p="dir"]{--chip-hue:var(--path)}
  .chip[data-p="low"]{--chip-hue:var(--primary)}   /* Ball Position: live ball → ember */
  .chip[data-p="arc"]{--chip-hue:var(--depth)}
  .chip[data-p="lie"]{--chip-hue:var(--ink)}

  .sliderZone{position:relative;flex:0 0 44px;display:flex;align-items:center}
  .track{position:absolute;left:13px;right:13px;top:50%;height:4px;margin-top:-2px;
    border-radius:2px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
  .fill{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;
    background:var(--slider-hue,var(--secondary))}
  .notch{position:absolute;top:50%;width:2px;height:12px;margin-top:-6px;
    background:var(--line-strong);border-radius:1px;display:none}
  #range{
    position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;
    background:transparent;margin:0;cursor:pointer;
  }
  #range::-webkit-slider-runnable-track{height:44px;background:transparent}
  #range::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:9px;
    background:var(--ink);border:3px solid var(--slider-hue,var(--secondary));
    box-shadow:0 2px 10px color-mix(in srgb,var(--bg) 60%,transparent);
  }
  #range::-moz-range-track{height:44px;background:transparent}
  #range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:3px solid var(--slider-hue,var(--secondary))}

  /* compact phones (568x320) */
  @media (max-width:620px){
    .top{height:54px}
    .card .val{font-size:15px}
    .card .lab{font-size:10px;letter-spacing:.04em}
    .chip .cl{font-size:10px;letter-spacing:.03em}
    .controls{height:calc(96px + env(safe-area-inset-bottom))}
    .orb{width:52px;min-height:54px}
    .orb svg{width:34px;height:30px}
  }
  @media (max-height:480px){
    .rail{gap:5px}
    .orb{width:52px;min-height:48px;height:48px;padding:2px 2px 4px;border-radius:12px}
    .orb svg{width:31px;height:27px}
    .orb .cap{font-size:10px}
    .view-toast{top:8px;min-height:32px;padding:7px 12px;font-size:10px}
  }
  @media (max-height:340px){
    .rail{top:5px;right:5px;flex-direction:row;gap:4px}
    .orb{width:44px;min-height:44px;height:44px;padding:1px;border-radius:11px}
    .orb svg{width:27px;height:23px}
    .orb .cap{font-size:10px;letter-spacing:0}
    .inset--max .inset__max{right:152px}
  }
  @media (hover:hover) and (pointer:fine){
    .orb:hover,.inset__max:hover{border-color:var(--line-strong)}
  }

  /* portrait gate — AVVIK (D59): orienteringsbetingelse + minimum 568×320.
     AVVIK (DESIGN/N-e, arvet): emoji ut (tegnet glyf), N-e-ordlyden. */
  .rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:var(--bg);text-align:center;padding:24px}
  .rotate .ico{width:46px;height:46px;animation:tilt 1.8s ease-in-out infinite;color:var(--muted-tk)}
  .rotate .ico svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:butt}
  .rotate p{font-size:15px;max-width:260px;color:var(--ink)}
  .rotate-home{position:absolute;
    top:max(8px, env(safe-area-inset-top));left:max(8px, env(safe-area-inset-left))}
  @keyframes tilt{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(78deg)}}
  @media (orientation:portrait), (max-width:567.98px), (max-height:319.98px){
    .rotate{display:flex}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .view-toast,.view-toast.is-visible{transform:translate(-50%,0)}
  }
</style>
</head>
<body data-screen="studio" data-home="../nav/index.html">

  <div class="top">
    <a class="ts-back" data-home-exit href="../nav/index.html" aria-label="Home">HOME</a>
    <div class="card attack" id="cardAttack">
      <div class="col">
        <div class="lab"><span class="dot"></span>ATTACK ANGLE</div>
        <div class="val" id="vAttack">&#8722;4.0&deg;</div>
      </div>
    </div>
    <div class="card path" id="cardPath">
      <div class="col">
        <div class="lab"><span class="dot"></span>CLUB PATH</div>
        <div class="val" id="vPath">0.0&deg;</div>
      </div>
    </div>
    <button id="resetBtn" aria-label="Reset">RESET</button>
  </div>

  <div class="stage" id="stage" data-view="face" data-ghost-anchor="impact">
    <canvas id="scene"></canvas>
    <div class="view-toast" id="viewToast" role="status" aria-live="polite" aria-hidden="true" hidden></div>
    <div class="inset" id="inset">
      <div class="eyebrow"><span>STRIKE<span class="ez"> &middot; CONTACT ZONE</span></span>
        <span class="st"><em id="insetQual">PURE</em>&nbsp;&middot;&nbsp;<span id="insetMm">0.0 mm</span></span></div>
      <div class="eyebrow2"><span id="insetCtx">MID-IRON &middot; HARDPAN <span class="mmv">0 mm</span></span><span class="ez" id="insetLoft"></span></div>
      <canvas id="insetCv"></canvas>
      <button id="insetMax" class="inset__max" aria-label="Open Strike contact zone">&#x2922;</button>
    </div>
    <div class="rail">
      <button class="orb" id="btnView" aria-label="Switch to Down the line">
        <svg viewBox="0 0 44 40" aria-hidden="true">
          <circle cx="22" cy="22" r="12.5" fill="none" stroke="var(--secondary-line)"
                  stroke-width="1.2" stroke-dasharray="2.5 3"/>
          <line x1="22" y1="22" x2="22" y2="8" stroke="rgba(245,242,255,.45)" stroke-width="1.3"/>
          <path d="M22 4.5 l-3 5 h6 z" fill="rgba(245,242,255,.55)"/>
          <circle cx="22" cy="22" r="3" fill="var(--ink)"/>
          <g id="camG" style="transform-origin:22px 22px;transform:rotate(-90deg);
                              transition:transform .24s cubic-bezier(.16,1,.3,1)">
            <g transform="translate(22 34.5)">
              <circle r="4.4" fill="var(--plate)" stroke="var(--secondary)" stroke-width="1.6"/>
              <circle r="1.6" fill="var(--secondary)"/>
            </g>
          </g>
        </svg>
        <span class="cap" id="viewCap">DTL</span>
      </button>
      <!-- AVVIK (D65/D17b): kølleknappen sykler tre køller; gress/pigg-glyfene
           kodet UNDERLAGET og er fjernet — lie er egen input (chip + stegslider). -->
      <button class="orb" id="btnClub" aria-label="Switch club">
        <span class="cap" id="clubCap">MID-IRON</span>
      </button>
      <button class="orb" id="btnContact" aria-label="Open Strike contact zone" aria-controls="inset" aria-expanded="false">
        <svg viewBox="0 0 44 40" aria-hidden="true">
          <line x1="6" y1="30" x2="38" y2="30" stroke="rgba(130,185,85,.72)" stroke-width="1.6"/>
          <path d="M7 19 C14 23 17 31 22 31 C27 31 30 23 37 19" fill="none"
                stroke="var(--strike)" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/>
          <circle cx="22" cy="31" r="2.6" fill="var(--strike)"/>
          <path d="M12 30 v4 M32 30 v4" stroke="var(--strike)" stroke-opacity=".55" stroke-width="1.2"/>
        </svg>
        <span class="cap">STRIKE</span>
      </button>
    </div>
  </div>

  <div class="controls">
    <div class="chips">
      <button class="chip" data-p="plane"><span class="cl">SWING PLANE</span><span class="cv" id="cvPlane">60.0&deg;</span></button>
      <button class="chip" data-p="dir"><span class="cl">SWING DIRECTION</span><span class="cv" id="cvDir">0.0&deg;</span></button>
      <button class="chip active" data-p="low"><span class="cl">BALL POSITION</span><span class="cv" id="cvLow">0.0 cm</span></button>
      <button class="chip" data-p="arc"><span class="cl">ARC HEIGHT</span><span class="cv" id="cvArc">0.0 cm</span></button>
      <button class="chip" data-p="lie"><span class="cl">LIE</span><span class="cv" id="cvLie">HARDPAN</span></button>
    </div>
    <div class="sliderZone" id="sliderZone">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
      <div class="notch" id="notch"></div>
      <input type="range" id="range" min="-20" max="20" step="0.1" value="0" />
    </div>
  </div>

  <div class="rotate" role="status">
    <!-- AVVIK (NAVIGASJON, låst): HOME finnes i BEGGE tilstander -->
    <a class="ts-back rotate-home" href="../nav/index.html" aria-label="Home">HOME</a>
    <span class="ico" aria-hidden="true">

        <line x1="19" y1="34.5" x2="27" y2="34.5"/></svg>
